services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.138.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    profiles: ["observability"]
    volumes:
      - ./docker/observability/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    ports: ["4317:4317", "4318:4318"]
    depends_on: [prometheus, tempo]
  prometheus:
    image: prom/prometheus:v3.7.2
    profiles: ["observability"]
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]
  tempo:
    image: grafana/tempo:2.8.2
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./docker/observability/tempo.yml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports: ["3200:3200"]
  grafana:
    image: grafana/grafana:12.2.0
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/agent-overview.json:/var/lib/grafana/dashboards/agent-overview.json:ro
    ports: ["3001:3000"]
    depends_on: [prometheus, tempo]
volumes:
  prometheus-data:
  tempo-data:
  grafana-data:
