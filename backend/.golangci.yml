version: "2"

run:
  go: "1.25"
  timeout: 5m
  tests: false
  relative-path-mode: gomod

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - staticcheck

# Backend dependency direction, size, cyclomatic complexity, and Agent exported
# protocol maps are enforced by internal/architecture AST tests. They are
# deliberately not expressed as ineffective text/forbidigo regexes here.
