      description: 默认只换本段；cascade=true 时后续已生成的段重新排队（并行出片的作品忽略）。expectedRevision 与当前段版本不一致时拒绝。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: episodeId
          required: true
          schema: { type: string }
