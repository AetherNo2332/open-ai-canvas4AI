openapi: 3.0.3
info:
  title: 影策 HTTP API
  version: "1.0.0"
  description: |
    路径前缀是 `/api`。前后端一起发布，不按路径做 API 版本。

    业务 JSON 信封为 `{ code, data, msg, reason }`。`code === 0` 表示成功；失败时 HTTP status 与
    `code` 都表达失败。`code` 默认等于 HTTP 状态；同一状态下的细分原因使用 `status*100+n`
    （例如 40301 配额、42901 限流）。机器判断请用 `reason`，不要解析 `msg`。

    TypeScript 调用面仍是 `web/src/services/api` 的 `http` 模块，不从本规范生成客户端。

    所有画布持久写入（含 desktop commands/undo/redo/restore、旧 PUT/删除）可用 X-Canvas-Edit-Proofs
    header 提供临时编辑证明 JSON 数组 [{canvasId,nodeId,sessionId,token}]；最多 128 项、32 KiB。
    header 不属于命令 canonical identity，不进入事件、回执或 URL；已提交 operationId 的重试可在租约过期后回放。
    活跃租约只保护作者字段。冲突 reason 为 node_locked 或 edit_proof_invalid，客户端必须保留草稿。
servers:
  - url: /api
security:
  - sessionCookie: []
tags:
  - name: meta
  - name: auth
  - name: projects
  - name: canvas
  - name: resources
  - name: tasks
  - name: assets
  - name: models
  - name: agent
  - name: admin
  - name: skills
paths:
  /diagnostics/preview:
    post:
      tags: [meta]
      summary: 预览当前账号的诊断包记录数量
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DiagnosticExportRequest"}
      responses:
        "200":
          description: 成功信封的 data 包含任务、画布变动、Agent 对话/事件数量和截断提示
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/DiagnosticPreview"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
  /diagnostics/export:
    post:
      tags: [meta]
      summary: 导出包含画布变动和 Agent 对话的脱敏 ZIP
      description: 仅当前用户的持久记录。包含业务对话文字，分享前需检查；不含媒体、系统提示、工具参数及结果正文。ZIP 上限 10 MiB。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DiagnosticExportRequest"}
      responses:
        "200":
          description: 诊断 ZIP，manifest schemaVersion 为 2
          headers:
            X-Diagnostic-Bundle-ID: {schema: {type: string}}
            X-Diagnostic-Schema-Version: {schema: {type: integer, enum: [2]}}
            Content-Disposition: {schema: {type: string}}
          content:
            application/zip:
              schema: {type: string, format: binary}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
  /admin/agent/workers:
    get:
      tags: [admin]
      summary: 列出已配置 Agent worker 身份（管理员）
      description: 返回 worker ID、作用用户、创建与撤销时间；不返回 bearer credential 或其哈希。
      responses:
        '200': {description: 信封 data.workers，列表不含 bearer credential}
        '403': {$ref: '#/components/responses/Error'}
    post:
      tags: [admin]
      summary: 配置 Agent worker 身份并签发一次性凭据（管理员）
      description: 响应中的 credential 仅此一次可见，响应使用 Cache-Control no-store；调用方不得将其写入日志、URL 或持久任务正文。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id]
              properties:
                id: {type: string, description: worker 身份 ID}
                userId: {type: string, description: 留空表示全局 worker；指定后只领取该用户任务}
      responses:
        '200': {description: 信封 data 包含 id、userId、仅此一次返回的 bearer credential；不得记录在日志中}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /admin/agent/workers/{id}:
    delete:
      tags: [admin]
      summary: 撤销 Agent worker 身份（管理员）
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        '200': {description: 信封 data.revoked 为 true}
        '403': {$ref: '#/components/responses/Error'}
  /admin/settings/agent-web-search:
    get:
      tags: [admin]
      summary: 读取联网搜索配置（管理员，密钥仅返回是否已配置）
      responses:
        '200': {description: 返回 setting，包含 enabled、hasApiKey、revision、updatedAt}
        '403': {$ref: '#/components/responses/Error'}
    put:
      tags: [admin]
      summary: 保存联网搜索配置（管理员）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision]
              properties:
                enabled: {type: boolean}
                apiKey: {type: string, description: 仅写入，不在读取响应中返回}
                clearApiKey: {type: boolean}
                expectedRevision: {type: integer, format: int64, minimum: 0}
      responses:
        '200': {description: 返回更新后的脱敏 setting}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /admin/settings/agent-scheduler:
    get:
      tags: [admin]
      summary: 读取 Agent 调度配置（管理员）
      responses:
        '200': {description: "返回 setting：dispatchConcurrency、maxResidentSessions、maxResidentPerUser、maxResidentPerCanvas、revision、updatedAt"}
        '403': {description: 无管理员权限}
    put:
      tags: [admin]
      summary: 保存 Agent 配置并广播热更新事件
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision, dispatchConcurrency, maxResidentSessions, maxResidentPerUser, maxResidentPerCanvas]
              properties:
                expectedRevision: {type: integer, format: int64, minimum: 0}
                dispatchConcurrency: {type: integer, minimum: 1, maximum: 16}
                maxResidentSessions: {type: integer, minimum: 1, maximum: 64}
                maxResidentPerUser: {type: integer, minimum: 1, maximum: 64, description: "同一用户跨画布、跨执行器的有效租约上限"}
                maxResidentPerCanvas: {type: integer, minimum: 1, maximum: 64}
      responses:
        '200': {description: 已持久化，返回新版 setting；执行器应用状态另行查询}
        '400': {description: 非法参数或额度关系}
        '403': {description: 无管理员权限}
        '409': {description: 配置版本已变更，请刷新}
  /admin/settings/agent-scheduler/status:
    get:
      tags: [admin]
      summary: 读取脱敏 Agent 执行器运行状态（管理员）
      responses:
        '200': {description: "返回 instances：instanceId、resident、capacity、claimReservations、dispatchActive、readyQueued、draining、readiness、readinessReason、appliedConfigRevision、lastHeartbeatAt、online。在线不等于就绪。"}
        '403': {description: 无管理员权限}
  /admin/settings/appearance/live2d:
    post:
      tags: [admin]
      summary: 导入管理员 Live2D 模型草稿（不自动启用）
      description: ZIP 最大 128 MiB，最多 256 条目；解压累计 384 MiB，单文件最大 128 MiB。只接受一个 Version 3 model3.json 及 ZIP 内 MOC3、PNG、JSON 引用。启用通过 PATCH /admin/settings/appearance 的 canvas 配置完成。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        "200":
          description: 成功信封 data.model 包含 resourceId 和服务端确认的 entry
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: integer, enum: [0]}
                  msg: {type: string}
                  data:
                    type: object
                    properties:
                      model:
                        type: object
                        required: [resourceId, entry]
                        properties:
                          resourceId: {type: string}
                          entry: {type: string}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /admin/settings/appearance/live2d/{id}/{file}:
    get:
      tags: [admin]
      summary: 读取模型草稿文件（管理员所有者或当前配置引用）
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: path, name: file, required: true, description: ZIP 内相对路径，可包含多级目录, schema: {type: string}}
      responses:
        "200": {description: JSON、PNG 或 MOC3 文件，非 JSON 信封}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /public/appearance/live2d/{id}/{file}:
    get:
      tags: [meta]
      security: []
      summary: 读取当前启用的 Live2D 模型文件
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: path, name: file, required: true, description: ZIP 内相对路径，可包含多级目录, schema: {type: string}}
      responses:
        "200": {description: JSON、PNG 或 MOC3 文件，非 JSON 信封；停用后拒绝公开读取}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /tools:
    get:
      tags: [canvas]
      summary: 列出可见且启用的生成工具
      parameters:
        - {in: query, name: scope, schema: {type: string, enum: [public, favorites, custom], default: public}}
        - {in: query, name: type, schema: {type: string, enum: [style, motion, nine_grid, effect]}}
        - {in: query, name: tag, schema: {type: string}}
        - {in: query, name: search, schema: {type: string}}
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: pageSize, schema: {type: integer, minimum: 1, maximum: 80, default: 20}}
      responses:
        "200": {description: "标准信封 data 为 tools（摘要不含 prompt/extraInfo）、totalCount、page、pageSize、hasMore"}
        "401": {description: 未登录}
    post:
      tags: [canvas]
      summary: 创建当前用户的工具
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ToolMutation'}
      responses:
        "200": {description: 标准信封 data 为完整工具}
        "400": {description: 参数无效或预览资源不符合要求}
        "401": {description: 未登录}
  /skills/presets:
    get:
      tags: [canvas]
      security: []
      summary: 获取公开场景技能预设目录
      responses:
        "200":
          description: 标准信封 data 为 presets 数组；预设只引用公开且启用的种子技能
        "500": {$ref: "#/components/responses/Error"}
  /skills:
    get:
      tags: [skills]
      summary: 列出技能；在个人技能视图按技能库分类筛选
      parameters:
        - {in: query, name: scope, schema: {type: string, enum: [public, mine, created, favorites], default: public}}
        - {in: query, name: libraryCategoryId, description: 用户技能库分类 ID，仅支持 mine 或 created 视图；与 libraryUncategorized 互斥, schema: {type: string}}
        - {in: query, name: libraryUncategorized, description: 仅列出未归类技能，仅支持 mine 或 created 视图；与 libraryCategoryId 互斥, schema: {type: boolean}}
      responses:
        "200": {description: 标准信封 data 为技能列表及分页信息；categories 含共享分类 value、label 和技能广场公开技能 count}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /skills/library-categories:
    get:
      tags: [skills]
      summary: 获取当前用户可见的技能库分类和数量
      parameters:
        - {in: query, name: scope, schema: {type: string, enum: [mine, created], default: mine}}
      responses:
        "200": {description: 标准信封 data 为 categories、totalCount、uncategorizedCount；分类含 id、name、scope、count}
        "401": {$ref: "#/components/responses/Error"}
    post:
      tags: [skills]
      summary: 创建个人或平台技能库分类
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 64}
                scope: {type: string, enum: [personal, platform], default: personal}
      responses:
        "200": {description: 标准信封 data.category 为新分类}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /skills/library-categories/{id}:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string}}
    delete:
      tags: [skills]
      summary: 删除技能库分类并解除相关技能归类，不删除技能
      responses:
        "200": {description: "标准信封 data 为 {deleted: true}"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /skills/{id}/library-category:
    parameters:
      - {in: path, name: id, required: true, description: 技能 ID, schema: {type: string}}
    patch:
      tags: [skills]
      summary: 为当前用户已加入或自建的技能设置/清除技能库分类
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [categoryId]
              properties:
                categoryId: {type: string, description: 个人分类或可见平台分类 ID；空字符串表示取消归类}
      responses:
        "200": {description: 标准信封 data.skill 为更新后的技能}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /tools/{id}:
    parameters:
      - {in: path, name: id, required: true, schema: {type: integer, format: int64, minimum: 1}}
    get:
      tags: [canvas]
      summary: 查询可见且启用工具的完整详情
      responses:
        "200": {description: 标准信封 data 为完整工具，包含 prompt 和 extraInfo}
        "404": {description: 工具不存在或不可见}
    delete:
      tags: [canvas]
      summary: 删除自己的用户工具及关联收藏，不删除预览文件
      responses:
        "200": {description: "标准信封 data 为 {deleted: true}"}
        "404": {description: 工具不存在或不能删除}
  /tools/{id}/favorite:
    parameters:
      - {in: path, name: id, required: true, schema: {type: integer, format: int64, minimum: 1}}
    post:
      tags: [canvas]
      summary: 幂等收藏可见工具
      responses:
        "200": {description: 标准信封 data 为完整工具和收藏状态}
        "404": {description: 工具不存在或不可见}
    delete:
      tags: [canvas]
      summary: 幂等取消收藏可见工具
      responses:
        "200": {description: 标准信封 data 为完整工具和收藏状态}
        "404": {description: 工具不存在或不可见}
  /model-catalog:
    get:
      tags: [models]
      summary: 获取创作端模型目录
      description: |
        固定 source=system，channels 直接来自系统渠道下的模型列表，models 为空数组；不反查逻辑模型。
        一级跨渠道按 displayName 分组，二级显示 channelLabel；模型请求仍使用 channelId + modelKey 定位。
        channelLabel 是后台渠道模型创建和更新时配置的渠道展示名，去除首尾空白后最多 80 字，空字符串表示使用所属渠道名称。
        description 是后台渠道模型创建和更新时填写的公开模型描述，去除首尾空白后最多 500 字；空字符串表示未填写。
        displayName 和 icon 用于一级模型菜单，channelLabel 不参与路由、权限或计费。
        渠道级 publicAlias 已废弃；成本配置和成本快照仅供管理端，不包含在本接口及用户报价中。
      responses:
        "200":
          description: 当前启用的模型目录
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    enum: [0]
                  msg:
                    type: string
                  data:
                    type: object
                    required: [source, models, channels]
                    properties:
                      source:
                        type: string
                        enum: [system]
                      models:
                        type: array
                        items:
                          type: object
                      channels:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            displayName:
                              type: string
                            models:
                              type: array
                              items:
                                type: object
                                properties:
                                  modelKey:
                                    type: string
                                  displayName:
                                    type: string
                                  icon:
                                    type: string
                                  channelLabel:
                                    type: string
                                    maxLength: 80
                                    default: ""
                                  tags:
                                    type: array
                                    maxItems: 5
                                    description: 后台模型创建及更新使用同名字段；文字去除首尾空白且不能重复，空数组清除标签，仅用于展示。
                                    items:
                                      type: object
                                      required: [text, color]
                                      properties:
                                        text:
                                          type: string
                                          minLength: 1
                                          maxLength: 12
                                        color:
                                          type: string
                                          enum: [purple, blue, green, gold, orange, pink]
                                  description:
                                    type: string
                                    maxLength: 500
                                    default: ""
        "401":
          $ref: "#/components/responses/Error"
  /model-catalog/quote:
    post:
      tags: [models]
      summary: 按当前参数预估系统渠道模型费用
      description: |
        需要登录会话 Cookie。仅接受启用的系统渠道和模型，采用服务端能力默认值及价格档选择规则。
        不创建任务或账单、不冻结或扣除积分，也不调用模型供应商。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channelId, modelKey, intent]
              properties:
                channelId:
                  type: string
                  minLength: 1
                modelKey:
                  type: string
                  minLength: 1
                  description: 系统渠道中配置的模型键
                intent:
                  $ref: "#/components/schemas/ModelRequestIntent"
      responses:
        "200":
          $ref: "#/components/responses/ModelQuote"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /models/{id}/quote:
    post:
      tags: [models]
      summary: 按当前参数预估前台模型费用
      description: |
        需要登录会话 Cookie。请求正文直接为创作意图，不使用 intent 外层包装。
        服务端按前台模型能力、默认参数、供应线路和价格策略报价，不创建任务、账单或积分冻结。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: 前台逻辑模型 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelRequestIntent"
      responses:
        "200":
          $ref: "#/components/responses/ModelQuote"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /canvas-projects/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [canvas]
      summary: 读取当前用户画布内容和 revision
      responses:
        "200":
          description: 信封 data.project 包含完整画布及服务端 revision
        "404":
          description: 画布不存在或不属于当前用户
    put:
      tags: [canvas]
      summary: 按 revision 保存画布内容
      parameters:
        - {$ref: "#/components/parameters/CanvasEditProofs"}
      description: 新建传 revision 0，更新传读取到的版本；成功原子加 1。referenceFieldsVersion=1 时，data.project 还包含服务端协调后的 connections 投影（包括空数组）。忽略客户端 viewport 和 remoteContentHash，updatedAt 由服务端生成。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project]
              properties:
                project:
                  type: object
                  required: [id, revision]
                  properties:
                    id: { type: string }
                    revision: { type: integer, format: int64, minimum: 0 }
                  additionalProperties: true
      responses:
        "200":
          description: 信封 data.project 返回摘要及递增后的 revision；规范化引用文档还返回服务端协调后的 connections 投影
        "400":
          description: 请求、版本或素材引用不合法
        "409":
          description: 版本或资源状态冲突，原内容未被覆盖；保留草稿后加载最新版
        "428":
          description: 缺少 revision，需刷新客户端并重新读取
  /canvas-projects/{id}/history:
    get:
      tags: [canvas]
      summary: 读取当前画布版本与最近 20 份历史摘要
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 信封 data 包含 currentRevision 和 snapshots；每项含 id、revision、title、nodeCount、connectionCount、payloadBytes、reason、contentUpdatedAt、createdAt，不含正文
        "404":
          description: 画布不存在或无权访问
  /canvas-projects/{id}/history/{snapshotId}:
    get:
      tags: [canvas]
      summary: 按需读取历史正文
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: snapshotId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 信封 data 包含 snapshot 摘要和 project 正文
        "404":
          description: 画布或快照不存在、已过期或无权访问
  /canvas-projects/{id}/history/{snapshotId}/restore:
    post:
      tags: [canvas]
      summary: 备份当前内容并将历史内容恢复为新版本
      parameters:
        - {$ref: "#/components/parameters/CanvasEditProofs"}
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: snapshotId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: 信封 data.project 返回恢复后的摘要及新 revision；当前 ID、归属与项目关联保留
        "404":
          description: 画布或快照不存在、已过期或无权访问
        "409":
          description: 当前版本或素材状态已变化，恢复未执行
        "428":
          description: 缺少当前 revision
  /canvas-projects/{id}/realtime:
    get:
      tags: [canvas]
      summary: 订阅已提交画布版本唤醒和临时设备 presence
      description: Cookie 鉴权的 WebSocket；校验 Origin，每15秒复核归属。无查询参数、token 或正文。所有 JSON 文本帧 protocolVersion 为1；客户端32KiB、80条每秒，服务端帧512KiB上限（必要时省略临时drag/cursor）。每房间64、进程1024连接。消息仅唤醒，events/snapshot/poll 为恢复依据；Redis降级标明degraded/recovering，设备号0无全局有效性。关闭1008表示策略或鉴权失效，1013表示背压，1001表示服务关闭。
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        "101": {description: WebSocket ready、sync、invalidate、peers、coordination 帧；无持久写入ACK}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /canvas-projects/{id}/sync-status:
    get:
      tags: [canvas]
      summary: 读取当前画布同步版本、活跃节点租约与多个 Agent 摘要
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        "200":
          description: 成功信封 data 为同步状态，leases 不含 token；不读取 Agent stateJSON
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: "#/components/schemas/Envelope"}
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/CanvasSyncStatus"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /canvas-projects/{id}/edit-leases/acquire:
    post:
      tags: [canvas]
      summary: 获取节点作者字段的 30 秒租约
      description: 客户端首次提交前生成随机 token 并保留至确认；同 session/token 可安全重试，sessionId 单独不能取回 token。其他标签页即使属于同一账号也互斥。响应禁止缓存。
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CanvasEditLeaseRequest"}
      responses:
        "200":
          description: 成功信封 data 为 proof 与 expiresAt（含 token，仅返回给持有者）
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409":
          description: node_locked 或 edit_proof_invalid；保留草稿，不覆盖现有租约
  /canvas-projects/{id}/edit-leases/renew:
    post:
      tags: [canvas]
      summary: 用现有 session/token 将租约续至当前时间后 30 秒
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CanvasEditLeaseRequest"}
      responses:
        "200": {description: 成功信封 data 返回原 proof 和新 expiresAt，禁止缓存}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {description: edit_proof_invalid；租约已过期或证明不符}
  /canvas-projects/{id}/edit-leases/release:
    post:
      tags: [canvas]
      summary: 持久保存确认后释放节点租约
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CanvasEditLeaseRequest"}
      responses:
        "200": {description: 成功信封 data.released 为 true}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {description: edit_proof_invalid；不能释放其他会话租约}
  /public/welcome:
    get:
      tags: [meta]
      security: []
      summary: 读取欢迎页开放状态
      responses:
        "200":
          description: 信封 data 仅包含 welcomeEnabled 布尔值，默认 true；Cache-Control 为 no-store
        "500":
          description: 配置读取失败
  /admin/agent/skill-defaults:
    get:
      tags: [admin]
      summary: 读取管理员 Agent 默认技能配置
      responses:
        "200":
          description: 信封 data 包含 revision、items（skillId、skillName、skillVersionId、versionLabel、position、enabled、status、fileCount、totalBytes）、totalFiles、totalBytes、contextEstimateBytes；合计仅统计启用项，上下文预估为技能包整体读入的保守上限
        "401": {description: 未登录}
        "403": {description: 需要管理员权限}
    put:
      tags: [admin]
      summary: 按 revision CAS 整体替换全局默认技能
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, items]
              properties:
                revision: {type: integer, format: int64, minimum: 0}
                items:
                  type: array
                  items:
                    type: object
                    required: [skillId, skillVersionId, position, enabled]
                    properties:
                      skillId: {type: string}
                      skillVersionId: {type: string}
                      position: {type: integer}
                      enabled: {type: integer, enum: [0, 1]}
      responses:
        "200": {description: 信封 data 包含新 revision；配置仅影响新会话}
        "400": {description: 无效引用 agent_skill_defaults_invalid 或超限 agent_skill_budget_exceeded（details 包含 budget、limit、actual）}
        "401": {description: 未登录}
        "403": {description: 需要管理员权限}
        "409": {description: agent_skill_defaults_revision_conflict，details.currentRevision 为当前修订号}
  /agent/skill-defaults:
    get:
      tags: [agent]
      summary: 读取全局默认技能摘要（登录即可）
      responses:
        "200": {description: 信封 data 为 count 与按 position 排序的 skills，每项只含 skillId、skillName；仅启用项，不含正文或管理员版本详情}
        "401": {description: 未登录}
  /agent/capabilities:
    get:
      tags: [agent]
      summary: 读取云端 Agent 能力
      responses:
        "200":
          description: 信封 data 包含 version、permissionModes、contextScopes、skills、writeTools、billing、maxHistoryPairs、maxSteps、maxHistoryBytes、capabilitySetVersion、capabilitySetHash、nodeTypes、tools；maxHistoryPairs 为跨轮保留的用户对话轮数，maxSteps 为 0 表示无固定模型调用上限，历史仍受 maxHistoryBytes 限制
  /agent/skills/usage:
    get:
      tags: [agent]
      summary: 读取当前用户技能的使用统计（由运行日志聚合，只读）
      responses:
        "200":
          description: 信封 data 含 scannedRuns、searchCalls 与按启用次数降序的 skills；每个技能含 runsEnabled、searchHits、readCalls、readFailures、entryReads、cardReads 与 topCards（最多 5 条最热卡路径）。统计仅覆盖调用方本人最近的运行，且不含任何技能正文
        "401":
          description: 未登录
  /agent/workspaces/{canvasId}:
    parameters:
      - {in: path, name: canvasId, required: true, schema: {type: string}}
    get:
      tags: [agent]
      summary: 读取画布 Workspace（懒创建一对一记录）
      responses:
        "200": {description: 信封 data 为 WorkspaceView，含 workspaceId、canvasId、revision、agentsMd、agentsMdHash；不含技能配置}
        "401": {description: 未登录}
        "404": {description: 画布不存在或不属于当前用户}
    patch:
      tags: [agent]
      summary: 使用 revision CAS 更新当前画布文档，仅影响新运行
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision, agentsMd]
              properties:
                revision: {type: integer, format: int64, minimum: 0}
                agentsMd: {type: string, description: UTF-8 文档最多 65536 字节；空字符串用于清空}
      responses:
        "200": {description: 更新后的 WorkspaceView}
        "400": {description: 非法 JSON、缺失字段或文档超限}
        "404": {description: 画布不存在或不属于当前用户}
        "409": {description: "reason=agent_workspace_revision_conflict，details.currentRevision 为当前 revision"}
  /agent/subagent-policy:
    get:
      tags: [agent]
      summary: 读取当前用户画布的持续子代理授权
      parameters:
        - {in: query, name: canvasId, required: true, schema: {type: string}}
      responses:
        "200": {$ref: "#/components/responses/Envelope"}
        "403": {$ref: "#/components/responses/Error"}
    put:
      tags: [agent]
      summary: CAS 更新当前用户画布的持续子代理授权
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [canvasId, enabled, expectedRevision]
              properties:
                canvasId: {type: string}
                enabled: {type: boolean}
                expectedRevision: {type: integer, format: int64, minimum: 0}
      responses:
        "200": {$ref: "#/components/responses/Envelope"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /agent/runs/{id}/subagents:
    get:
      tags: [agent]
      summary: 读取父 Agent 运行创建的动态子代理
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        "200": {$ref: "#/components/responses/Envelope"}
        "404": {$ref: "#/components/responses/Error"}
  /agent/settings:
    get:
      tags: [agent]
      summary: 读取当前账户的 Agent 自定义系统提示词与 revision
      responses:
        "200": {$ref: "#/components/responses/Envelope"}
        "401": {$ref: "#/components/responses/Error"}
    patch:
      tags: [agent]
      summary: 保存账户级 Agent 系统提示词，空字符串恢复默认
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [systemPrompt, revision]
              properties:
                systemPrompt:
                  type: string
                  maxLength: 12000
                  description: 直接注入后续新建运行的系统上下文，不改变平台权限和审批规则
                revision:
                  type: integer
                  minimum: 0
                  description: 首次保存为 0，后续使用读取结果中的 revision
      responses:
        "200": {$ref: "#/components/responses/Envelope"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /agent/memories:
    get:
      tags: [agent]
      summary: 列出当前用户的 Agent 记忆
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, approved, rejected]
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: 信封 data.memories
        "401":
          $ref: "#/components/responses/Error"
    post:
      tags: [agent]
      summary: 手动添加一条个人记忆（直接批准）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topic, category, situation]
              properties:
                topic: { type: string }
                category: { type: string }
                situation: { type: string }
                lesson: { type: string }
                source: { type: string }
                steps:
                  type: array
                  items:
                    type: object
                    properties:
                      tool: { type: string }
                      action: { type: string }
                      note: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /agent/memories/export:
    get:
      tags: [agent]
      summary: 导出当前用户的 Agent 记忆
      responses:
        "200":
          description: 信封 data 为 version/kind/exportedAt/memories
        "401":
          $ref: "#/components/responses/Error"
  /agent/memories/import:
    post:
      tags: [agent]
      summary: 导入 Agent 记忆 JSON
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version: { type: integer }
                kind: { type: string }
                memories: { type: array }
      responses:
        "200":
          description: 信封 data 含 imported、merged、skipped
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /agent/memories/settings:
    get:
      tags: [agent]
      summary: 读取当前用户的记忆压缩设置与最近一次压缩状态
      responses:
        "200":
          description: 信封 data 含 compactInterval、模型字段、lastStatus、summary
        "401":
          $ref: "#/components/responses/Error"
    patch:
      tags: [agent]
      summary: 更新记忆压缩周期和文本模型
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                compactInterval:
                  type: string
                  enum: [off, daily, weekly, monthly]
                logicalModelId: { type: string }
                channelId: { type: string }
                channelModelKey: { type: string }
                model: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /agent/memories/compact:
    post:
      tags: [agent]
      summary: 提交一次个人记忆压缩任务（走用户文本模型计费）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                logicalModelId: { type: string }
                channelId: { type: string }
                channelModelKey: { type: string }
                model: { type: string }
      responses:
        "200":
          description: 信封 data 为压缩设置视图，lastStatus 为 queued
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /agent/memories/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    patch:
      tags: [agent]
      summary: 更新一条属于当前用户的记忆
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [agent]
      summary: 删除一条属于当前用户的记忆
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /agent/memories/{id}/decide:
    post:
      tags: [agent]
      summary: 批准或拒绝一条属于当前用户的待审记忆
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approve, reject]
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /agent/conversations:
    get:
      tags: [agent]
      summary: 读取当前用户在画布中参与的 Agent 对话
      description: 只读目录，不创建运行或调用模型。按最新轮 createdAt、id 倒序；即使对话后来换绑画布，latestRunId、status、revision、cleanupPending 仍来自该对话全局最新一轮。仅返回当前登录用户的记录，画布必须属于当前用户。
      parameters:
        - in: query
          name: canvasId
          required: true
          schema: { type: string, maxLength: 80 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - in: query
          name: before
          description: 上一页返回的不透明 nextCursor
          schema: { type: string, maxLength: 512 }
      responses:
        "200":
          description: 信封 data 为 items（id、canvasId、title、latestRunId、status、revision、cleanupPending、createdAt、updatedAt）和可选 nextCursor；没有记录时 items 为空数组
        "400":
          description: 画布 ID、limit 或分页游标无效
        "404":
          description: 画布不存在或不属于当前用户
  /agent/conversations/{id}/runs:
    get:
      tags: [agent]
      summary: 按时间顺序恢复当前用户的完整 Agent 对话轮次
      description: 仅返回当前用户、同一 conversationId 的不可变轮次，包含跨页面换绑画布后的轮次。按 createdAt、id 升序分页；每轮默认带尾部事件窗口，完整事件使用运行详情 fromStart 和 sinceSeq 分页读取。读取不恢复执行或重复调用工具。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, maxLength: 80 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - in: query
          name: after
          description: 上一页返回的不透明 nextCursor
          schema: { type: string, maxLength: 512 }
      responses:
        "200":
          description: 信封 data 为 items（与 data.run 相同的运行视图，含 conversationId、userPrompt、idempotencyKey）和可选 nextCursor
        "400":
          description: 会话 ID、limit 或分页游标无效
        "404":
          description: 会话不存在或不属于当前用户
  /agent/ui-settings:
    get:
      tags: [agent]
      summary: 读取账号默认发送方式
      responses:
        "200": { description: "data 含 defaultSendMode（interject 或 queue）与 revision" }
        "401": { $ref: "#/components/responses/Error" }
    patch:
      tags: [agent]
      summary: 按版本保存账号默认发送方式
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision, defaultSendMode]
              properties:
                revision: { type: integer, format: int64, minimum: 0 }
                defaultSendMode: { type: string, enum: [interject, queue] }
      responses:
        "200": { description: 返回保存后的设置与 revision }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /agent/conversations/{id}/messages:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, maxLength: 80 } }
    post:
      tags: [agent]
      summary: 向当前会话插话或加入持久待发队列
      description: 相同幂等身份与原请求重试返回既有收条；排队不创建运行或预留费用。expectedRunId 必须是已知最新轮，replyToQuestionId 只允许显式 interject 回答当前问题。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentConversationMessageRequest"
      responses:
        "200": { description: "data 含 delivery（queued、started、interjected 或 cancelled）、messageId、conversationId、queueRevision 和实际 runId；queued 仅表示已收下待发消息" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /agent/conversations/{id}/queue:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, maxLength: 80 } }
    get:
      tags: [agent]
      summary: 读取会话的有序待发消息与暂停状态
      responses:
        "200": { description: "data 含 conversationId、canvasId、revision、paused、pauseReason、awaitingQuestionId、questionRunId、latestRunId、items。items 按 sequence 升序，字段为 id、prompt、mode、revision、status、sequence、runId、error、createdAt、updatedAt；不返回内部请求或幂等身份" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [agent]
      summary: 按版本暂停或恢复待发队列
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision, action]
              properties:
                revision: { type: integer, format: int64, minimum: 1 }
                action: { type: string, enum: [pause, resume] }
      responses:
        "200": { description: 返回最新队列状态 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /agent/conversations/{id}/queue/{messageId}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, maxLength: 80 } }
      - { in: path, name: messageId, required: true, schema: { type: string, maxLength: 80 } }
    patch:
      tags: [agent]
      summary: 编辑未派发消息或提升为插队
      description: prompt 和 action 二选一，已领取或已派发时拒绝；提升失败保留原项。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision]
              properties:
                revision: { type: integer, format: int64, minimum: 1 }
                prompt: { type: string, maxLength: 16000 }
                action: { type: string, enum: [interject] }
      responses:
        "200": { description: 返回消息投递收条 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [agent]
      summary: 移除未派发消息并保留幂等收条
      parameters:
        - { in: query, name: revision, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        "200": { description: 返回 cancelled 消息收条 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /agent/runs:
    post:
      tags: [agent]
      summary: 创建一轮云端 Agent 任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloudAgentRequest"
      responses:
        "200":
          description: 信封 data.run，包含新一轮 id、canvasId、status、permissionMode、model 及时间
        "400":
          description: 参数、能力、模型或预算不符合要求，未创建任务
        "409":
          description: 幂等键已用于不同请求
  /agent/runs/{id}:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
    get:
      tags: [agent]
      summary: 读取当前用户的 Agent 轮次
      description: data.run 只返回一页事件（默认最新 40 条）并带上 eventSeqBase、eventCount、latestSeq、eventsTruncated：eventSeqBase 是本次首条事件之前已入库的条数（不变量 events[i].seq == eventSeqBase + i + 1），latestSeq 可直接作为下次 sinceSeq，eventsTruncated 表示还有更早的记录未随本次返回。读取走 (run_id, sequence) 的 keyset 分页，不使用 offset；升级前把事件放在 state_json 里的轮次在事件表中没有行，读取回退到内存窗口。
      parameters:
        - in: query
          name: fromStart
          description: true 从 seq=1 读取首条事件；后续按 sinceSeq/limit 分页，latestSeq 与 eventCount 用于判断是否追平。
          schema: { type: boolean, default: false }
        - in: query
          name: sinceSeq
          required: false
          description: 只返回该事件序号之后的事件（非负整数，单次最多 500 条）；追平或越界时返回空 events
          schema: { type: integer, minimum: 0 }
        - in: query
          name: eventLimit
          required: false
          description: 单次返回的事件条数上限，1–500，默认为尾部窗口大小
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: 信封 data.run（含 events 与 eventSeqBase / eventCount / latestSeq / eventsTruncated）
        "400":
          description: sinceSeq 或 eventLimit 不是整数或超出范围
        "404":
          description: 轮次不存在或不属于当前用户
  /agent/runs/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
    post:
      tags: [agent]
      summary: 从服务端父轮历史创建新轮次
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloudAgentRequest"
      responses:
        "200":
          description: 信封 data.run（新的 ID）
        "409":
          description: 父轮仍在执行、幂等键冲突或已有后续轮次（reason 为 agent_conversation_stale_parent）。原请求幂等回放优先于父轮检查，拒绝的旧父轮请求不产生积分预留。
  /agent/runs/{id}/interjections:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
    post:
      tags: [agent]
      summary: 向正在运行的 Agent 轮次插入一句话
      description: 不新建轮次、不产生新的扣费身份。插话排进当前运行，在下一次模型调用前送达；运行已结束返回 409。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text, messageId]
              properties:
                text:
                  type: string
                  maxLength: 4000
                messageId:
                  type: string
                  maxLength: 160
      responses:
        "200":
          description: 信封 data.accepted 与 data.pending
        "409":
          description: 本轮已结束，应改为新一轮发送
  /agent/runs/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
    post:
      tags: [agent]
      summary: 取消当前用户的 Agent 轮次
      responses:
        "200":
          description: 信封 data.accepted
  /agent/runs/{id}/undo:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
    post:
      tags: [agent]
      summary: 撤销当前 Agent 运行产生的最新画布变更
      description: 仅撤销仍是最新快照、且未提交生成任务的画布变更；不会取消任务或退款。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedSnapshotHash]
              properties:
                stepId:
                  type: string
                  maxLength: 160
                expectedSnapshotHash:
                  type: string
                  minLength: 64
                  maxLength: 64
                  pattern: '^[0-9a-fA-F]{64}$'
                reason:
                  type: string
                  maxLength: 2000
      responses:
        "200":
          description: 信封 data.accepted 与当前快照哈希
        "400":
          description: 请求无效、快照不可撤销或已提交任务不能撤销
        "409":
          description: 画布已发生后续变化、操作已处理或 stepId 不匹配
  /agent/runs/{id}/approvals/{approvalId}/decision:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
      - name: approvalId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [agent]
      summary: 提交 Agent 工具审批决定
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approve, reject]
                reason:
                  type: string
                  maxLength: 2000
                mediaSettings:
                  type: object
                  additionalProperties: false
                  description: 仅 approve 图片生成审批可传；替换本次模型、画幅和质量，重新强校验，不修改提示词、引用或目标。logicalModelId 与 channelId + channelModelKey 二选一。
                  required: [size, quality]
                  properties:
                    logicalModelId:
                      type: string
                    channelId:
                      type: string
                    channelModelKey:
                      type: string
                    size:
                      type: string
                    quality:
                      type: string
      responses:
        "200":
          description: 信封 data.accepted
        "409":
          description: 审批不存在、已过期或决定冲突
  /agent/runs/{id}/events:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
    get:
      tags: [agent]
      summary: Agent 运行事件回放与持续订阅
      parameters:
        - name: after
