openapi: 3.0.3
info:
  title: 影策 HTTP API
  version: "1.0.0"
  description: |
    路径前缀是 `/api`。前后端一起发布，不按路径做 API 版本。

    业务 JSON 信封为 `{ code, data, msg, reason }`。`code === 0` 表示成功；失败时 HTTP status 与
    `code` 都表达失败。`code` 默认等于 HTTP 状态；同一状态下的细分原因使用 `status*100+n`
    （例如 40301 配额、42901 限流）。机器判断请用 `reason`，不要解析 `msg`。

    TypeScript 调用面仍是 `web/src/services/api` 的 `http` 模块，不从本规范生成客户端。
servers:
  - url: /api
security:
  - sessionCookie: []
tags:
  - name: meta
  - name: auth
  - name: projects
  - name: canvas
  - name: resources
  - name: tasks
  - name: assets
  - name: models
  - name: agent
  - name: admin
  - name: skills
  - name: workbench
  - name: feedback
    description: 用户反馈与管理员收件箱
  - name: referral
    description: 推广中心：推广码、邀请记录与返佣
  - name: inspirations
    description: 灵感大厅上新（定时同步的上游中文提示词）
  - name: pose-library
    description: 站点姿势库：浏览、选用，管理员导入与图片同步
  - name: creation-platform
  - name: payment
    description: 充值与支付设置
  - name: drama
    description: 短剧自动制作与精修画布
paths:
  /admin/ecommerce/skills/install:
    post:
      tags: [admin]
      summary: 安装或更新本站电商 Skill（管理员）
      description: ZIP或Markdown，最大1GiB，允许超过500MiB；同本地文件名覆盖更新，保留别名及开关。正文和引用合计32KB/12文件。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        "200": {description: 安装完成，默认启用}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /admin/ecommerce/skills/install/github:
    post:
      tags: [admin]
      summary: 从GitHub安装电商Skill并跟随来源分支自动更新
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: {type: string}
                subdir: {type: string}
      responses:
        "200": {description: 安装完成，自动更新默认开启}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /admin/ecommerce/skills/{id}/name:
    patch:
      tags: [admin]
      summary: 修改用户安装的电商Skill显示名称
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 80}
      responses:
        "200": {description: 名称已保存，上游更新后保留}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /ecommerce/download:
    post:
      tags: [ecommerce-agent]
      summary: 通过浏览器原生下载流式导出当前用户的商品原图 ZIP
      description: 先校验全部资源归属与就绪状态，再发送附件响应并流式读取原件；不创建生成任务。最多500张、总计2GB。
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [resourceId]
              properties:
                resourceId: {type: array, minItems: 1, maxItems: 500, items: {type: string}}
            encoding:
              resourceId: {style: form, explode: true}
      responses:
        "200": {description: 原始图片 ZIP 附件，application/zip}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    get:
      tags: [ecommerce-agent]
      summary: 通过重复 resourceId 查询参数下载当前用户的原图 ZIP
      parameters:
        - {"name": "resourceId", "in": "query", "required": true, "style": "form", "explode": true, "schema": {"type": "array", "minItems": 1, "maxItems": 500, "items": {"type": "string"}}}
      responses:
        "200": {description: ZIP 归档附件, content: {application/zip: {schema: {type: string, format: binary}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /admin/ecommerce/categories:
    get:
      tags: [admin]
      summary: 按中英文路径浏览或搜索行业、品类和子品类及其有效创作方法
      parameters:
        - {in: query, name: parentId, schema: {type: string}, description: 留空浏览一级行业}
        - {in: query, name: q, schema: {type: string, maxLength: 128}}
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        "200": {description: data 含 nodes、lineage、total、page、limit 和 coverage；每个节点提供 methodScope、methodAncestorId 和有效 playbook，coverage 分别统计完整分类目录与方法覆盖}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /admin/ecommerce/skills:
    get:
      tags: [admin]
      summary: 管理员读取已安装电商技能、来源、固定版本和启停状态
      responses:
        "200":
          {
            description: data.skills 为技能列表，包含 id、name、enabled、instructions、contentHash、sourceUrl 和 sourceCommit,
          }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/ecommerce/skills/{id}:
    patch:
      tags: [admin]
      summary: 管理员启停指定电商技能，对新策划及关联知识检索生效
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200": { description: data.enabled 为已保存状态 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /agent/quote:
    post:
      tags: [ecommerce-agent]
      summary: 读取图像渠道定价并计算本次预留积分，不创建订单
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/EcommerceAgentRequest" },
                },
            },
        }
      responses:
        "200":
          {
            description: data 含 pageCount、unitMicrocredits、totalMicrocredits、modelKey 和 channel,
          }
        "400": { $ref: "#/components/responses/Error" }
  /agent/analyze:
    post:
      tags: [ecommerce-agent]
      summary: 分析商品图并给出平台相关设计方向
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/EcommerceAgentRequest" },
                },
            },
        }
      responses:
        "200": { description: data 含 brief、recommendations、styleLibrary }
        "400": { $ref: "#/components/responses/Error" }
  /agent/recommend:
    post:
      tags: [ecommerce-agent]
      summary: 根据商品与平台重新推荐方向
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/EcommerceAgentRequest" },
                },
            },
        }
      responses:
        "200": { description: data 含 4 至 6 个推荐方向 }
  /agent/projects/{projectId}/task:
    get:
      tags: [ecommerce-agent]
      summary: 按当前用户的项目读取最新 Agent 任务，供页面刷新恢复
      parameters:
        - {
            in: path,
            name: projectId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: data 含 task、pages、posterCanvas }
        "404": { $ref: "#/components/responses/Error" }
  /agent/generate:
    post:
      tags: [ecommerce-agent]
      summary: 同步生成整套商品图片与可编辑画布
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/EcommerceAgentRequest" },
                },
            },
        }
      responses:
        "200": { description: data 含 task、pages、posterCanvas }
        "402": { $ref: "#/components/responses/Error" }
  /agent/generate/stream:
    post:
      tags: [ecommerce-agent]
      summary: 逐页流式生成，data 行包含 event 字段
      description: 事件为 workflow_started、node_finished、iteration_completed、message、PING。断开连接取消上游，已成功页按实际页数结算。
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/EcommerceAgentRequest" },
                },
            },
        }
      responses:
        "200": { description: text/event-stream }
  /agent/help-write:
    post:
      tags: [ecommerce-agent]
      summary: 优化商品出图需求
      responses:
        "200": { description: data 含 status、optimized、reason、alternatives }
  /canvas/placeholder:
    post:
      tags: [ecommerce-agent]
      summary: 返回 1 至 15 页灰格画布骨架
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
  /canvas/save:
    post:
      tags: [ecommerce-agent]
      summary: 保存当前用户电商项目的画布版本
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
  /canvas/{projectId}:
    get:
      tags: [ecommerce-agent]
      summary: 读取最新画布和最近 20 个版本的元数据
      parameters:
        [
          {
            in: path,
            name: projectId,
            required: true,
            schema: { type: string },
          },
        ]
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
  /task/{taskId}:
    get:
      tags: [ecommerce-agent]
      summary: 断线后读取电商出图任务及逐页结果
      parameters:
        [{ in: path, name: taskId, required: true, schema: { type: string } }]
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
  /task/{taskId}/cancel:
    post:
      tags: [ecommerce-agent]
      summary: 请求取消电商出图任务
      parameters:
        [{ in: path, name: taskId, required: true, schema: { type: string } }]
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
  /projects/{id}/assets/{assetId}/image:
    put:
      tags: [projects, assets]
      summary: 为场景或道具绑定图片并创建新版本
      description: 校验项目归属、资产关联、版本归属与就绪图片资源；过期版本拒绝。旧版本与图片引用保留。
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: assetId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resourceId, expectedVersionId]
              properties:
                resourceId: { type: string, minLength: 1 }
                expectedVersionId: { type: string, minLength: 1 }
      responses:
        "200":
          description: 成功信封 data={asset}，包含 visual.definition/status 和新版本、图片资源定位
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /admin/login-logs:
    get:
      tags: [admin]
      summary: 管理员分页查询用户登录登出日志
      description: 按时间倒序，保留用户快照；失败账号脱敏，无密码、验证码或会话凭据。
      parameters:
        - {
            in: query,
            name: keyword,
            schema: { type: string, maxLength: 160 },
            description: 用户名、昵称、脱敏账号或用户 ID,
          }
        - {
            in: query,
            name: event,
            schema: { type: string, enum: [login, logout] },
          }
        - {
            in: query,
            name: method,
            schema:
              {
                type: string,
                enum: [password, email, sms, linuxdo, oidc, verification, unknown],
              },
          }
        - {
            in: query,
            name: result,
            schema: { type: string, enum: [success, failed] },
          }
        - {
            in: query,
            name: ip,
            schema: { type: string },
            description: 精确匹配 IPv4 或 IPv6,
          }
        - {
            in: query,
            name: from,
            schema: { type: string, format: date-time },
            description: 包含开始时刻，RFC3339,
          }
        - {
            in: query,
            name: to,
            schema: { type: string, format: date-time },
            description: 包含结束时刻，RFC3339,
          }
        - {
            in: query,
            name: page,
            schema: { type: integer, minimum: 1, default: 1 },
          }
        - {
            in: query,
            name: pageSize,
            schema: { type: integer, minimum: 1, default: 20 },
          }
      responses:
        "200":
          description: 成功信封 data={logs,total,page,pageSize}
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, enum: [0] }
                  msg: { type: string }
                  data:
                    type: object
                    properties:
                      logs:
                        {
                          type: array,
                          items: { $ref: "#/components/schemas/LoginLog" },
                        }
                      total: { type: integer }
                      page: { type: integer }
                      pageSize: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /admin/login-logs/{id}:
    get:
      tags: [admin]
      summary: 管理员读取单条登录日志详情
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: 成功信封 data.log
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, enum: [0] }
                  msg: { type: string }
                  data:
                    type: object
                    properties:
                      log: { $ref: "#/components/schemas/LoginLog" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /feedbacks:
    post:
      tags: [feedback]
      summary: 提交用户反馈
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedbackSubmission" }
      responses:
        "200":
          description: 成功信封，data 为新建反馈
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/UserFeedback" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /feedbacks/my:
    get:
      tags: [feedback]
      summary: 读取当前用户自己的反馈列表
      responses:
        "200":
          description: 成功信封，data 为按创建时间倒序排列的反馈数组
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/UserFeedback" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /feedbacks/attachments:
    post:
      tags: [feedback]
      summary: 上传用户反馈图片或视频附件
      description: 单文件最大 50 MiB；整个 multipart 请求体最大 55 MiB。文件交由现有资源服务保存。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: 成功信封，data 为附件元数据
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/FeedbackAttachment" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /admin/feedbacks:
    get:
      tags: [feedback, admin]
      summary: 管理员筛选和分页查询反馈
      parameters:
        - {
            in: query,
            name: type,
            schema:
              { type: string, enum: [all, bug, feature, improvement, other] },
          }
        - {
            in: query,
            name: status,
            schema:
              {
                type: string,
                enum: [all, pending, processing, resolved, closed, archived],
              },
          }
        - {
            in: query,
            name: keyword,
            schema: { type: string },
            description: 匹配标题、正文、用户名或联系方式,
          }
        - { in: query, name: archived, schema: { type: boolean } }
        - {
            in: query,
            name: page,
            schema: { type: integer, minimum: 1, default: 1 },
          }
        - {
            in: query,
            name: pageSize,
            schema: { type: integer, minimum: 1, default: 20 },
            description: 大于 100 时服务端使用默认值 20,
          }
      responses:
        "200":
          description: 成功信封，data 含 list、total、page、limit
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/FeedbackListResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /admin/feedbacks/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    patch:
      tags: [feedback, admin]
      summary: 更新反馈状态、答复或归档标志
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedbackAdminUpdate" }
      responses:
        "200":
          description: 成功信封，data 为更新后的反馈
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/UserFeedback" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      tags: [feedback, admin]
      summary: 删除反馈记录
      responses:
        "200":
          description: 成功信封 data={ok:true}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          ok: { type: boolean, enum: [true] }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /admin/feedbacks/{id}/archive:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      tags: [feedback, admin]
      summary: 归档反馈
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /admin/feedbacks/{id}/unarchive:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      tags: [feedback, admin]
      summary: 取消归档反馈
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /pose-library/poses:
    get:
      tags: [pose-library]
      summary: 按姿势分组浏览已启用且已同步的姿势
      parameters:
        - { in: query, name: keyword, schema: { type: string } }
        - { in: query, name: system, schema: { type: string } }
        - { in: query, name: category, schema: { type: string } }
        - { in: query, name: angle, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 60, default: 24 } }
      responses:
        "200": { description: "data 含 poses（每个姿势带 items 视角列表）、total、page、pageSize、facets（systems/categories/angles 计数）；不含来源署名" }
        "401": { $ref: "#/components/responses/Error" }
  /pose-library/items/{id}/thumb:
    get:
      tags: [pose-library]
      summary: 读取姿势缩略图（本站数据目录）
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: query, name: v, schema: { type: integer }, description: 同步版本号，仅用于缓存失效 }
      responses:
        "200": { description: 图片字节，Cache-Control private max-age=604800 }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /pose-library/items/{id}/image:
    get:
      tags: [pose-library]
      summary: 读取姿势原图（本站数据目录）
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: query, name: v, schema: { type: integer } }
      responses:
        "200": { description: 图片字节 }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /pose-library/use:
    post:
      tags: [pose-library]
      summary: 把选中的姿势原图复制成当前用户的资源
      description: 1–16 个条目，按普通上传计入用户每日上传额度与容量；同一用户同一张图重复选用复用已有资源。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, minItems: 1, maxItems: 16, items: { type: string } }
      responses:
        "200": { description: "data.items 为 [{itemId,name,angle,category,resource}]，顺序与请求一致" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /admin/pose-library/items:
    get:
      tags: [pose-library, admin]
      summary: 姿势库条目、同步统计、来源与按体系汇总（管理员）
      parameters:
        - { in: query, name: keyword, schema: { type: string } }
        - { in: query, name: source, schema: { type: string } }
        - { in: query, name: system, schema: { type: string } }
        - { in: query, name: status, schema: { type: string, enum: [pending, ready, failed] } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200": { description: "data 含 items、total、page、pageSize、stats、sources、systems" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [pose-library, admin]
      summary: 上传一张自建姿势图（管理员）
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, name]
              properties:
                file: { type: string, format: binary, description: JPEG/PNG/WebP，最大 20 MiB }
                name: { type: string }
                system: { type: string }
                category: { type: string }
                angle: { type: string }
                code: { type: string, description: 编号相同的图合并为同一姿势的不同视角 }
      responses:
        "200": { description: data.item 为新条目 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/pose-library/import:
    post:
      tags: [pose-library, admin]
      summary: 导入 ai-pose-gallery-zh 的 pose-zh.json 或 yingce-pose-library 姿势包（管理员）
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, systems]
              properties:
                file: { type: string, format: binary, description: JSON，最大 16 MiB }
                baseUrl: { type: string, description: 图片来源根地址，相对路径拼在其后 }
                systems: { type: string, description: JSON 字符串数组，只导入列出的体系 }
      responses:
        "200": { description: "data 含 source、format、total、created、updated、skipped、invalid、systems" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/pose-library/sync:
    post:
      tags: [pose-library, admin]
      summary: 下载一批待同步条目的图片到本站数据目录（管理员）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                limit: { type: integer, minimum: 1, maximum: 40, default: 12 }
                retryFailed: { type: boolean, description: 先把失败条目放回待同步，只在一轮的第一批传入 }
      responses:
        "200": { description: "data 含 processed、succeeded、failed、failures、stats" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/pose-library/items/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    patch:
      tags: [pose-library, admin]
      summary: 修改姿势条目（管理员）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                system: { type: string }
                category: { type: string }
                angle: { type: string }
                code: { type: string }
                enabled: { type: boolean }
      responses:
        "200": { description: data.item 为更新后的条目 }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [pose-library, admin]
      summary: 删除姿势条目及其图片（管理员）
      responses:
        "200": { description: "data={ok:true}" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/pose-library/bulk:
    post:
      tags: [pose-library, admin]
      summary: 按条目或体系批量启用、停用、删除、重新同步（管理员）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [enable, disable, delete, resync] }
                ids: { type: array, maxItems: 1000, items: { type: string } }
                sourceKey: { type: string }
                system: { type: string, description: 不传 ids 时必填 }
      responses:
        "200": { description: "data={affected}" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /admin/settings/appearance/live2d:
    post:
      tags: [admin]
      summary: 导入管理员 Live2D 模型草稿（不自动启用）
      description: ZIP 最大 128 MiB，最多 256 条目；解压累计 384 MiB，单文件最大 128 MiB。只接受一个 Version 3 model3.json 及 ZIP 内 MOC3、PNG、JSON 引用。启用通过 PATCH /admin/settings/appearance 的 canvas 配置完成。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: 成功信封 data.model 包含 resourceId 和服务端确认的 entry
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, enum: [0] }
                  msg: { type: string }
                  data:
                    type: object
                    properties:
                      model:
                        type: object
                        required: [resourceId, entry]
                        properties:
                          resourceId: { type: string }
                          entry: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /admin/settings/appearance/live2d/{id}/{file}:
    get:
      tags: [admin]
      summary: 读取模型草稿文件（管理员所有者或当前配置引用）
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - {
            in: path,
            name: file,
            required: true,
            description: ZIP 内相对路径，可包含多级目录,
            schema: { type: string },
          }
      responses:
        "200": { description: JSON、PNG 或 MOC3 文件，非 JSON 信封 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /public/appearance/live2d/{id}/{file}:
    get:
      tags: [meta]
      security: []
      summary: 读取当前启用的 Live2D 模型文件
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - {
            in: path,
            name: file,
            required: true,
            description: ZIP 内相对路径，可包含多级目录,
            schema: { type: string },
          }
      responses:
        "200":
          {
            description: JSON、PNG 或 MOC3 文件，非 JSON 信封；停用后拒绝公开读取,
          }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/settings/appearance/avatar-bundles:
    post:
      tags: [admin]
      summary: 导入 Agent 状态动画 ZIP 草稿（不自动启用）
      description: ZIP 最大 128 MiB，解压累计最大 384 MiB、最多 128 个条目；根目录须包含 version 1 的 avatar.json 和其引用的 MP4。上传后需通过 PATCH /admin/settings/appearance 配置 avatarBundleResourceId 与 avatarClipStates 才会公开播放。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: 成功信封 data.bundle 包含 resourceId 和已校验 manifest
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, enum: [0] }
                  msg: { type: string }
                  data:
                    type: object
                    properties:
                      bundle:
                        type: object
                        required: [resourceId, manifest]
                        properties:
                          resourceId: { type: string }
                          manifest:
                            type: object
                            required: [version, width, height, clips]
                            properties:
                              version: { type: integer, enum: [1] }
                              width:
                                { type: integer, minimum: 1, maximum: 4096 }
                              height:
                                { type: integer, minimum: 1, maximum: 4096 }
                              clips:
                                {
                                  type: object,
                                  additionalProperties: { type: string },
                                }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /admin/settings/appearance/avatar/{id}/{file}:
    get:
      tags: [admin]
      summary: 预览动画包文件（上传者或当前配置引用的管理员）
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - {
            in: path,
            name: file,
            required: true,
            description: avatar.json 或 manifest 引用的 MP4 文件名,
            schema: { type: string },
          }
      responses:
        "200": { description: JSON 或 MP4 原始内容，支持 MP4 Range 请求 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /public/appearance/avatar/{id}/{file}:
    get:
      tags: [meta]
      security: []
      summary: 读取当前启用的 Agent 动画包文件
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - {
            in: path,
            name: file,
            required: true,
            description: avatar.json 或 manifest 引用的 MP4 文件名,
            schema: { type: string },
          }
      responses:
        "200":
          { description: JSON 或 MP4 原始内容，支持 Range；停用后拒绝公开读取 }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /tools:
    get:
      tags: [canvas]
      summary: 列出可见且启用的生成工具
      parameters:
        - {
            in: query,
            name: scope,
            schema:
              {
                type: string,
                enum: [public, favorites, custom],
                default: public,
              },
          }
        - {
            in: query,
            name: type,
            schema: { type: string, enum: [style, motion, nine_grid, effect] },
          }
        - { in: query, name: tag, schema: { type: string } }
        - { in: query, name: search, schema: { type: string } }
        - {
            in: query,
            name: page,
            schema: { type: integer, minimum: 1, default: 1 },
          }
        - {
            in: query,
            name: pageSize,
            schema: { type: integer, minimum: 1, maximum: 80, default: 20 },
          }
      responses:
        "200":
          {
            description: "标准信封 data 为 tools（摘要不含 prompt/extraInfo）、totalCount、page、pageSize、hasMore",
          }
        "401": { description: 未登录 }
    post:
      tags: [canvas]
      summary: 创建当前用户的工具
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ToolMutation" }
      responses:
        "200": { description: 标准信封 data 为完整工具 }
        "400": { description: 参数无效或预览资源不符合要求 }
        "401": { description: 未登录 }
  /skills/presets:
    get:
      tags: [canvas]
      security: []
      summary: 获取公开场景技能预设目录
      responses:
        "200":
          description: 标准信封 data 为 presets 数组；预设只引用公开且启用的种子技能
        "500": { $ref: "#/components/responses/Error" }
  /skills/recommendations:
    get:
      tags: [skills]
      summary: 按行业列出推荐安装的内置技能
      responses:
        "200":
          {
            description: "标准信封 data 为 {industries, installedTotal}；每个行业含 industryId、name、description、icon、installedCount 和 skills（skillId、skillName、description、tag、reason、isAdded）。只读目录，不会自动安装",
          }
        "401": { $ref: "#/components/responses/Error" }
  /skills/recommendations/{industryId}/install:
    parameters:
      - {
          in: path,
          name: industryId,
          required: true,
          description: 推荐行业 ID,
          schema: { type: string },
        }
    post:
      tags: [skills]
      summary: 把某个行业的推荐技能加入当前用户技能库
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                skillIds:
                  type: array
                  maxItems: 12
                  items: { type: string }
                  description: 只安装其中这些技能；传 {} 或空数组时安装该行业全部推荐
      responses:
        "200":
          {
            description: "标准信封 data 为 {industryId, installed, skipped}；已安装、已删除或不在该行业推荐里的技能计入 skipped，不报错",
          }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /skills:
    get:
      tags: [skills]
      summary: 列出技能；在个人技能视图按技能库分类筛选
      parameters:
        - {
            in: query,
            name: scope,
            schema:
              {
                type: string,
                enum: [public, mine, created, favorites],
                default: public,
              },
          }
        - {
            in: query,
            name: libraryCategoryId,
            description: 用户技能库分类 ID，仅支持 mine 或 created 视图；与 libraryUncategorized 互斥,
            schema: { type: string },
          }
        - {
            in: query,
            name: libraryUncategorized,
            description: 仅列出未归类技能，仅支持 mine 或 created 视图；与 libraryCategoryId 互斥,
            schema: { type: boolean },
          }
      responses:
        "200":
          {
            description: 标准信封 data 为技能列表及分页信息；categories 含共享分类 value、label 和技能广场公开技能 count,
          }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /skills/library-categories:
    get:
      tags: [skills]
      summary: 获取当前用户可见的技能库分类和数量
      parameters:
        - {
            in: query,
            name: scope,
            schema: { type: string, enum: [mine, created], default: mine },
          }
      responses:
        "200":
          {
            description: 标准信封 data 为 categories、totalCount、uncategorizedCount；分类含 id、name、scope、count,
          }
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [skills]
      summary: 创建个人或平台技能库分类
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 64 }
                scope:
                  {
                    type: string,
                    enum: [personal, platform],
                    default: personal,
                  }
      responses:
        "200": { description: 标准信封 data.category 为新分类 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /skills/library-categories/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    delete:
      tags: [skills]
      summary: 删除技能库分类并解除相关技能归类，不删除技能
      responses:
        "200": { description: "标准信封 data 为 {deleted: true}" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /skills/{id}/agent-mode:
    parameters:
      - {
          in: path,
          name: id,
          required: true,
          description: 技能 ID,
          schema: { type: string },
        }
    patch:
      tags: [skills]
      summary: 设置已安装技能是否进入 Agent 自动发现目录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  {
                    type: string,
                    enum: [auto, manual],
                    description: auto 进入技能目录由 Agent 按任务自动发现；manual 只在用户固定或点名时使用,
                  }
      responses:
        "200": { description: 标准信封 data.skill 为更新后的技能 }
        "400": { description: mode 无效，或技能未安装（自建技能除外） }
        "401": { $ref: "#/components/responses/Error" }
        "404": { description: 技能不存在或对当前用户不可见 }
  /skills/{id}/library-category:
    parameters:
      - {
          in: path,
          name: id,
          required: true,
          description: 技能 ID,
          schema: { type: string },
        }
    patch:
      tags: [skills]
      summary: 为当前用户已加入或自建的技能设置/清除技能库分类
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [categoryId]
              properties:
                categoryId:
                  {
                    type: string,
                    description: 个人分类或可见平台分类 ID；空字符串表示取消归类,
                  }
      responses:
        "200": { description: 标准信封 data.skill 为更新后的技能 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /skills/{id}/files:
    parameters:
      - {
          in: path,
          name: id,
          required: true,
          description: 技能 ID,
          schema: { type: string },
        }
    put:
      tags: [skills]
      summary: 作者批量写入、重命名或删除技能包文本文件，并生成新的技能版本
      description: 按顺序应用 operations 后重建 ZIP 与文件清单；SKILL.md 变化时同步 instruction。baseVersionId 必须等于当前版本，否则返回 409 skill_version_conflict，details.currentVersionId 为最新版本。GitHub 技能返回 409 failed_precondition。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseVersionId, operations]
              properties:
                baseVersionId:
                  { type: string, description: 编辑开始时读取到的 versionId }
                operations:
                  type: array
                  minItems: 1
                  maxItems: 256
                  items:
                    type: object
                    required: [op, path]
                    properties:
                      op: { type: string, enum: [write, rename, delete] }
                      path:
                        {
                          type: string,
                          description: 规范化相对路径，最多 8 层，不允许 .. / 绝对路径 / .git / 控制字符,
                        }
                      to: { type: string, description: rename 的目标路径 }
                      content:
                        {
                          type: string,
                          description: write 的 UTF-8 文本，单文件不超过 512KB,
                        }
      responses:
        "200":
          {
            description: 标准信封 data 为 skill、files 与 changed；内容未变化时 changed=false 且不生成版本,
          }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /tools/{id}:
    parameters:
      - {
          in: path,
          name: id,
          required: true,
          schema: { type: integer, format: int64, minimum: 1 },
        }
    get:
      tags: [canvas]
      summary: 查询可见且启用工具的完整详情
      responses:
        "200":
          { description: 标准信封 data 为完整工具，包含 prompt 和 extraInfo }
        "404": { description: 工具不存在或不可见 }
    delete:
      tags: [canvas]
      summary: 删除自己的用户工具及关联收藏，不删除预览文件
      responses:
        "200": { description: "标准信封 data 为 {deleted: true}" }
        "404": { description: 工具不存在或不能删除 }
  /tools/{id}/favorite:
    parameters:
      - {
          in: path,
          name: id,
          required: true,
          schema: { type: integer, format: int64, minimum: 1 },
        }
    post:
      tags: [canvas]
      summary: 幂等收藏可见工具
      responses:
        "200": { description: 标准信封 data 为完整工具和收藏状态 }
        "404": { description: 工具不存在或不可见 }
    delete:
      tags: [canvas]
      summary: 幂等取消收藏可见工具
      responses:
        "200": { description: 标准信封 data 为完整工具和收藏状态 }
        "404": { description: 工具不存在或不可见 }
  /model-catalog:
    get:
      tags: [models]
      summary: 获取创作端模型目录
      description: |
        固定 source=system，channels 直接来自系统渠道下的模型列表，models 为空数组；不反查逻辑模型。
        一级跨渠道按 displayName 分组，二级显示 channelLabel；模型请求仍使用 channelId + modelKey 定位。
        channelLabel 是后台渠道模型创建和更新时配置的渠道展示名，去除首尾空白后最多 80 字，空字符串表示使用所属渠道名称。
        description 是后台渠道模型创建和更新时填写的公开模型描述，去除首尾空白后最多 500 字；空字符串表示未填写。
        displayName 和 icon 用于一级模型菜单，channelLabel 不参与路由、权限或计费。
        渠道级 publicAlias 已废弃；成本配置和成本快照仅供管理端，不包含在本接口及用户报价中。
      responses:
        "200":
          description: 当前启用的模型目录
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    enum: [0]
                  msg:
                    type: string
                  data:
                    type: object
                    required: [source, models, channels]
                    properties:
                      source:
                        type: string
                        enum: [system]
                      models:
                        type: array
                        items:
                          type: object
                      channels:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            displayName:
                              type: string
                            models:
                              type: array
                              items:
                                type: object
                                properties:
                                  modelKey:
                                    type: string
                                  displayName:
                                    type: string
                                  icon:
                                    type: string
                                  channelLabel:
                                    type: string
                                    maxLength: 80
                                    default: ""
                                  textWire:
                                    type: string
                                    enum: [chat-completion, responses, claude-api]
                                    description: 仅文本模型。按协议插件的 create.path 识别的请求格式，浏览器据此选择系统代理路径；识别不出时省略。
                                  tags:
                                    type: array
                                    maxItems: 5
                                    description: 后台模型创建及更新使用同名字段；文字去除首尾空白且不能重复，空数组清除标签，仅用于展示。
                                    items:
                                      type: object
                                      required: [text, color]
                                      properties:
                                        text:
                                          type: string
                                          minLength: 1
                                          maxLength: 12
                                        color:
                                          type: string
                                          enum:
                                            [
                                              purple,
                                              blue,
                                              green,
                                              gold,
                                              orange,
                                              pink,
                                            ]
                                  description:
                                    type: string
                                    maxLength: 500
                                    default: ""
        "401":
          $ref: "#/components/responses/Error"
  /model-catalog/quote:
    post:
      tags: [models]
      summary: 按当前参数预估系统渠道模型费用
      description: |
        需要登录会话 Cookie。仅接受启用的系统渠道和模型，采用服务端能力默认值及价格档选择规则。
        不创建任务或账单、不冻结或扣除积分，也不调用模型供应商。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channelId, modelKey, intent]
              properties:
                channelId:
                  type: string
                  minLength: 1
                modelKey:
                  type: string
                  minLength: 1
                  description: 系统渠道中配置的模型键
                intent:
                  $ref: "#/components/schemas/ModelRequestIntent"
      responses:
        "200":
          $ref: "#/components/responses/ModelQuote"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /models/{id}/quote:
    post:
      tags: [models]
      summary: 按当前参数预估前台模型费用
      description: |
        需要登录会话 Cookie。请求正文直接为创作意图，不使用 intent 外层包装。
        服务端按前台模型能力、默认参数、供应线路和价格策略报价，不创建任务、账单或积分冻结。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: 前台逻辑模型 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelRequestIntent"
      responses:
        "200":
          $ref: "#/components/responses/ModelQuote"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /canvas-projects/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [canvas]
      summary: 读取当前用户画布内容和 revision
      responses:
        "200":
          description: 信封 data.project 包含完整画布及服务端 revision
        "304":
          description: If-None-Match 命中当前 revision，正文为空
        "404":
          description: 画布不存在或不属于当前用户
    delete:
      tags: [canvas]
      summary: 显式删除当前用户画布
      description: 删除后迟到的媒体回写和编辑操作不会重新创建画布；只有新的 create_canvas operation 可以显式创建同 ID 画布。
      responses:
        "200":
          description: 画布已删除，信封 data.id 返回画布 ID
        "401":
          description: 未登录
        "404":
          description: 画布不存在或不属于当前用户
  /canvas-projects/{id}/sync-status:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [canvas]
      summary: 读取当前用户画布版本、输入租约及 Agent 占用状态
      description: 需要登录并拥有画布。仅返回 revision、服务端时间、有效租约和 Agent 控制字段，不返回 token、完整画布或 Agent 对话正文；WebSocket 通知后校验状态，连接正常且无活动 Agent 时每三十秒补偿读取，断线或活动 Agent 期间恢复前台两秒、后台十五秒非重叠查询。版本变化后再读取正文。
      responses:
        "200":
          description: 信封 data 含 revision、serverTime、leases 和可空的 agent；每项租约含 nodeId、sessionId、expiresAt，agent 只含 runId、status、cleanupPending
        "401":
          description: 未登录
        "404":
          description: 画布不存在或不属于当前用户
  /canvas-projects/{id}/realtime:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [canvas]
      summary: 建立画布多窗口光标、拖拽预览与同步通知 WebSocket
      description: 使用登录 Cookie，校验画布归属和 Origin。welcome 返回 selfId/peers，每个 peer 包含服务端分配的 number（1–64），同一会话在各窗口编号一致且存续期间不变；Redis 模式跨实例分配并续期临时编号。客户端发送世界坐标 presence，服务端广播 peer/leave/invalidate/heartbeat。光标与拖拽预览不入库，invalidate 只在事务提交后发送，收到后通过 sync-status 校准。协议细节见画布操作同步专题。
      responses:
        "101":
          description: 已升级到 WebSocket
        "401":
          description: 未登录
        "403":
          description: 来源不允许
        "404":
          description: 画布不存在或不属于当前用户
        "503":
          description: 实时服务暂不可用，客户端保留 HTTP 同步
  /canvas-projects/{id}/edit-lease:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      tags: [canvas]
      summary: 获取、续期或释放节点文字编辑租约
      description: 需要登录并拥有画布。服务端有效期 30 秒，实际输入才获取；续期与释放必须携带当前 token。请求最大 2048 字节，每用户每分钟最多 240 次；过期持有者不能影响新持有者。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, nodeId, sessionId]
              properties:
                action:
                  type: string
                  enum: [acquire, renew, release]
                nodeId:
                  type: string
                  minLength: 1
                  maxLength: 160
                sessionId:
                  type: string
                  minLength: 1
                  maxLength: 160
                token:
                  type: string
                  maxLength: 80
      responses:
        "200":
          description: 信封 data 含 serverTime；获取及续期额外返回 lease 和 token，释放不返回 token
        "400":
          description: 参数无效
        "401":
          description: 未登录
        "404":
          description: 画布不存在或不属于当前用户
        "409":
          description: reason 为 canvas_edit_lease_conflict；节点被其他窗口占用或证明已过期
        "429":
          description: 请求超过频率限制
  /canvas-projects/{id}/operations:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    patch:
      tags: [canvas]
      summary: 按对象或字段变更写入画布
      description: |
        请求只提交对象级或字段级 operations，不提交整批画布快照。
        mutationId 是一次请求的幂等身份；响应丢失、断网、刷新或后台重试时必须复用同一个 mutationId 与原始 operations。
        更新、删除和连接操作要求目标存在并通过对象基线校验；同一字段冲突不会覆盖远端修改。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mutationId, operations]
              properties:
                mutationId:
                  type: string
                  minLength: 1
                  maxLength: 160
                  description: 一次写入请求的幂等身份
                baseRevision:
                  type: integer
                  format: int64
                  minimum: 0
                  description: 生成 operations 时已确认的画布 revision，用于诊断和响应
                editProofs:
                  type: array
                  maxItems: 500
                  description: 本次修改涉及节点的编辑证明，节点不可重复；不计入 mutation 摘要，原请求 receipt 可在租约过期后重放
                  items:
                    type: object
                    required: [nodeId, sessionId, token]
                    properties:
                      nodeId: { type: string, minLength: 1, maxLength: 160 }
                      sessionId: { type: string, minLength: 1, maxLength: 160 }
                      token: { type: string, minLength: 1, maxLength: 80 }
                operations:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required: [type]
                    additionalProperties: true
                    description: create_canvas、create_node、patch_node、remove_node、create_connection、update_connection、remove_connection 或 set_field
      responses:
        "200":
          description: 信封 data.project 返回当前画布摘要，data.mutationId 返回原 mutationId
        "400":
          description: 请求、字段、对象基线或素材引用格式不合法
        "401":
          description: 未登录
        "404":
          description: 画布不存在或不属于当前用户，且请求未包含显式 create_canvas
        "409":
          description: 对象并发冲突、同一 mutationId 对应的请求摘要不同或编辑证明失效（reason 为 canvas_edit_lease_conflict）；原事务不会被覆盖
        "428":
          description: 缺少执行所需的对象基线
  /public/welcome:
    get:
      tags: [meta]
      security: []
      summary: 读取欢迎页开放状态
      responses:
        "200":
          description: 信封 data 仅包含 welcomeEnabled 布尔值，默认 true；Cache-Control 为 no-store
        "500":
          description: 配置读取失败
  /public/inspirations/feed:
    get:
      tags: [inspirations]
      security: []
      summary: 读取灵感上新条目（匿名可读）
      description: 后端定时从 YouMind、awesome-seedance 同步的中文条目，按首次收录时间倒序，最多 3000 条；进程内缓存 5 分钟。按 IP 每分钟 120 次。
      responses:
        "200": { description: "data={enabled,entries[{id,title,description,image,mode,prompt,category?,tags?,sourceId,credit?,sourceUrl?,addedAt,publishedAt?}],categories{来源:{分类码:名称}},syncedAt?}；enabled=false 时 entries 为空" }
        "429": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /admin/settings/inspiration-feed:
    get:
      tags: [inspirations, admin]
      summary: 灵感上新状态（管理员）
      responses:
        "200": { description: "data.status={enabled,intervalHours,lastAttemptAt?,lastSuccessAt?,nextSyncAt?,lastError?,trigger?,sources[{sourceId,upstream,accepted,created,updated,error?}],total,bySource}" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    patch:
      tags: [inspirations, admin]
      summary: 开启或关闭灵感上新（管理员）
      description: 关闭后停止同步，公开接口不再返回已收录条目；写入管理员审计。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200": { description: data.status 为最新状态 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/settings/inspiration-feed/sync:
    post:
      tags: [inspirations, admin]
      summary: 立即同步灵感上新（管理员）
      description: 同步与请求解绑，最长约 8 分钟；部分来源失败仍返回 200，失败原因在 status.lastError 与 sources[].error。
      responses:
        "200": { description: data.status 为同步后的状态 }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { description: 上新已关闭，或另一实例/请求正在同步 }
        "502": { description: 全部来源都同步失败 }
  /agent/capabilities:
    get:
      tags: [agent]
      summary: 读取云端 Agent 能力
      responses:
        "200":
          description: 信封 data 包含 version、permissionModes、contextScopes、skills、writeTools、billing、maxHistoryPairs、maxSteps、maxHistoryBytes、capabilitySetVersion、capabilitySetHash、nodeTypes、tools；maxHistoryPairs 为跨轮保留的用户对话轮数，maxSteps 为 0 表示无固定模型调用上限，历史仍受 maxHistoryBytes 限制
  /agent/skills/usage:
    get:
      tags: [agent]
      summary: 读取当前用户技能的使用统计（由运行日志聚合，只读）
      responses:
        "200":
          description: 信封 data 含 scannedRuns、searchCalls 与按启用次数降序的 skills；每个技能含 runsEnabled、searchHits、readCalls、readFailures、entryReads、cardReads 与 topCards（最多 5 条最热卡路径）。统计仅覆盖调用方本人最近的运行，且不含任何技能正文
        "401":
          description: 未登录
  /agent/memory:
    get:
      tags: [agent]
      summary: 读取当前用户的 Agent 记忆文件
      responses:
        "200": {description: "标准信封 data 为 {mode, capacity, charCount, revision, entries, pendingCount, updatedAt}；entries 每条含 id、section（user|notes）、text"}
        "401": {$ref: "#/components/responses/Error"}
    put:
      tags: [agent]
      summary: 用户整体保存记忆文件（按 revision CAS）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, entries]
              properties:
                revision: {type: integer, format: int64, description: 读取时的 revision；不一致返回 409}
                entries:
                  type: array
                  maxItems: 80
                  items:
                    type: object
                    required: [section, text]
                    properties:
                      id: {type: string, description: 保留原条目 ID；新条目留空}
                      section: {type: string, enum: [user, notes]}
                      text: {type: string, description: 单条最多 400 字}
      responses:
        "200": {description: 返回保存后的记忆文件；总量不得超过 capacity（5000 字），疑似密钥或敏感内容返回 400}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "409": {description: 记忆文件已被 Agent 或其他页面修改，须重新读取}
  /agent/memory/settings:
    patch:
      tags: [agent]
      summary: 设置记忆模式
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: {type: string, enum: [auto, review, off], description: auto 直接写入并可撤销；review 先暂存待确认；off 不注入也不提供写入工具}
      responses:
        "200": {description: 返回更新后的记忆文件}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
  /agent/memory/revisions:
    get:
      tags: [agent]
      summary: 列出记忆文件的修改记录
      parameters:
        - {in: query, name: status, schema: {type: string, enum: [applied, pending, rejected]}}
        - {in: query, name: limit, description: 默认 50, schema: {type: integer, minimum: 1, maximum: 200}}
      responses:
        "200": {description: "标准信封 data.revisions；每条含 id、actor（agent|user|restore|seed|admin）、runId、status、summary、baseRevision、revision、changes、canUndo、createdAt"}
        "401": {$ref: "#/components/responses/Error"}
  /agent/memory/revisions/{revisionId}/undo:
    parameters:
      - {in: path, name: revisionId, required: true, schema: {type: string}}
    post:
      tags: [agent]
      summary: 撤销一次已生效的修改（恢复到修改前快照，并记一条 restore 修订）
      responses:
        "200": {description: 返回撤销后的记忆文件}
        "400": {description: 修订未生效、已撤销或本身就是撤销；或撤销后会超过记忆容量}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {description: 这条修改涉及的条目之后又被改过，无法自动撤销}
  /agent/memory/revisions/{revisionId}/decide:
    parameters:
      - {in: path, name: revisionId, required: true, schema: {type: string}}
    post:
      tags: [agent]
      summary: 采纳或拒绝 review 模式下的待确认修改
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: {type: string, enum: [approve, reject]}
      responses:
        "200": {description: 返回处理后的记忆文件}
        "400": {description: decision 无效，或这条修改已经处理过}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {description: 记忆文件已在待确认修改之后变化，须重新查看}
  /agent/conversations:
    get:
      tags: [agent]
      summary: 读取当前用户在画布中参与的 Agent 对话
      description: 只读目录，不创建运行或调用模型。按最新轮 createdAt、id 倒序；即使对话后来换绑画布，latestRunId、status、revision、cleanupPending 仍来自该对话全局最新一轮。仅返回当前登录用户的记录，画布必须属于当前用户。
      parameters:
        - in: query
          name: canvasId
          required: true
          schema: { type: string, maxLength: 80 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - in: query
          name: before
          description: 上一页返回的不透明 nextCursor
          schema: { type: string, maxLength: 512 }
      responses:
        "200":
          description: 信封 data 为 items（id、canvasId、title、latestRunId、status、revision、cleanupPending、archived、createdAt、updatedAt）和可选 nextCursor；archived 为 true 时移除本地历史入口，不加载正文；没有记录时 items 为空数组
        "400":
          description: 画布 ID、limit 或分页游标无效
        "404":
          description: 画布不存在或不属于当前用户
  /agent/conversations/{id}:
    delete:
      tags: [agent]
      summary: 从历史列表移除当前用户的 Agent 对话
      description: 持久归档；目录返回 archived 标记供其他设备移除缓存。保留运行记录与费用凭据，不取消正在执行的任务。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, maxLength: 80 }
      responses:
        "200":
          description: 信封 data 为 archived true
        "404":
          description: 对话不存在或不属于当前用户
  /agent/conversations/{id}/runs:
    get:
      tags: [agent]
      summary: 按时间顺序恢复当前用户的完整 Agent 对话轮次
      description: 仅返回当前用户、同一 conversationId 的不可变轮次，包含跨页面换绑画布后的轮次。按 createdAt、id 升序分页；每轮默认带尾部事件窗口，完整事件使用运行详情 fromStart 和 sinceSeq 分页读取。读取不恢复执行或重复调用工具。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, maxLength: 80 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - in: query
          name: after
          description: 上一页返回的不透明 nextCursor
          schema: { type: string, maxLength: 512 }
      responses:
        "200":
          description: 信封 data 为 items（与 data.run 相同的运行视图，含 conversationId、userPrompt、idempotencyKey）和可选 nextCursor
        "400":
          description: 会话 ID、limit 或分页游标无效
        "404":
          description: 会话不存在或不属于当前用户
  /agent/runs:
    post:
      tags: [agent]
      summary: 创建一轮云端 Agent 任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloudAgentRequest"
      responses:
        "200":
          description: 信封 data.run，包含新一轮 id、canvasId、status、permissionMode、model 及时间
        "400":
          description: 参数、能力、模型或预算不符合要求，未创建任务
        "409":
          description: 幂等键已用于不同请求
  /agent/runs/{id}:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
    get:
      tags: [agent]
      summary: 读取当前用户的 Agent 轮次
      description: data.run 只返回一页事件（默认最新 40 条）并带上 eventSeqBase、eventCount、latestSeq、eventsTruncated：eventSeqBase 是本次首条事件之前已入库的条数（不变量 events[i].seq == eventSeqBase + i + 1），latestSeq 可直接作为下次 sinceSeq，eventsTruncated 表示还有更早的记录未随本次返回。读取走 (run_id, sequence) 的 keyset 分页，不使用 offset；升级前把事件放在 state_json 里的轮次在事件表中没有行，读取回退到内存窗口。
      parameters:
        - in: query
          name: fromStart
          description: true 从 seq=1 读取首条事件；后续按 sinceSeq/limit 分页，latestSeq 与 eventCount 用于判断是否追平。
          schema: { type: boolean, default: false }
        - in: query
          name: sinceSeq
          required: false
          description: 只返回该事件序号之后的事件（非负整数，单次最多 500 条）；追平或越界时返回空 events
          schema: { type: integer, minimum: 0 }
        - in: query
          name: eventLimit
          required: false
          description: 单次返回的事件条数上限，1–500，默认为尾部窗口大小
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: 信封 data.run（含 events 与 eventSeqBase / eventCount / latestSeq / eventsTruncated）
        "400":
          description: sinceSeq 或 eventLimit 不是整数或超出范围
        "404":
          description: 轮次不存在或不属于当前用户
  /agent/runs/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
    post:
      tags: [agent]
      summary: 从服务端父轮历史创建新轮次
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloudAgentRequest"
      responses:
        "200":
          description: 信封 data.run（新的 ID）
        "409":
          description: 父轮仍在执行、幂等键冲突或已有后续轮次（reason 为 agent_conversation_stale_parent）。原请求幂等回放优先于父轮检查，拒绝的旧父轮请求不产生积分预留。
  /agent/runs/{id}/interjections:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
    post:
      tags: [agent]
      summary: 向正在运行的 Agent 轮次插入一句话
      description: 不新建轮次、不产生新的扣费身份。插话排进当前运行，在下一次模型调用前送达；运行已结束返回 409。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text, messageId]
              properties:
                text:
                  type: string
                  maxLength: 4000
                messageId:
                  type: string
                  maxLength: 160
      responses:
        "200":
          description: 信封 data.accepted 与 data.pending
        "409":
          description: 本轮已结束，应改为新一轮发送
  /agent/runs/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
    post:
      tags: [agent]
      summary: 取消当前用户的 Agent 轮次
      responses:
        "200":
          description: 信封 data.accepted
  /agent/runs/{id}/undo:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
    post:
      tags: [agent]
      summary: 撤销当前用户一次已结束 Agent 运行的全部画布修改
      description: 只恢复本次运行改过的节点、连线和画布字段，其他人之后对别的节点的修改保留；撤销作为一次新修订写入。本次运行提交过生成任务时拒绝，不会取消任务或退款。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  maxLength: 2000
      responses:
        "200":
          description: 信封 data 为 { revision, restoredNodeIds }：撤销后的画布 revision 与被恢复（删除或还原）的节点 ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: integer, enum: [0]}
                  msg: {type: string}
                  data:
                    type: object
                    required: [revision, restoredNodeIds]
                    properties:
                      revision: {type: integer, format: int64}
                      restoredNodeIds:
                        type: array
                        items: {type: string}
        "400":
          description: 请求无效、快照未完整保留或本次运行已提交生成任务
        "404":
          description: 运行不存在或不属于当前用户，或本次运行没有可撤销的画布修改
        "409":
          description: reason=agent_undo_conflict 表示本次运行改过的内容之后又被编辑过，画布未改动，details.ids 为冲突的节点/连线/字段；运行仍在进行时返回 reason=conflict
  /agent/runs/{id}/approvals/{approvalId}/decision:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
      - name: approvalId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [agent]
      summary: 提交 Agent 工具审批决定
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approve, reject]
                reason:
                  type: string
                  maxLength: 2000
                mediaSettings:
                  type: object
                  additionalProperties: false
                  description: 仅 approve 图片生成审批可传；替换本次模型、画幅和质量，重新强校验，不修改提示词、引用或目标。logicalModelId 与 channelId + channelModelKey 二选一。
                  required: [size, quality]
                  properties:
                    logicalModelId:
                      type: string
                    channelId:
                      type: string
                    channelModelKey:
                      type: string
                    size:
                      type: string
                    quality:
                      type: string
      responses:
        "200":
          description: 信封 data.accepted
        "409":
          description: 审批不存在、已过期或决定冲突
  /agent/runs/{id}/events:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
    get:
      tags: [agent]
      summary: Agent 运行事件回放与持续订阅
      parameters:
        - name: after
          in: query
          schema:
            type: integer
            minimum: 0
        - name: Last-Event-ID
          in: header
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: 首次及 revision 变化时发送紧凑 run_snapshot；无变化时 heartbeat；agent_event.seq 为递增游标，cleanupPending 期间持续发送
          content:
            text/event-stream:
              schema:
                type: string
  /openapi.yaml:
    get:
      tags: [meta]
      security: []
      summary: 本 OpenAPI 文档
      responses:
        "200":
          description: OpenAPI 3.0 YAML
          content:
            application/yaml:
              schema:
                type: string
  /admin/channels/{id}/duplicate:
    post:
      tags: [admin]
      summary: 复制系统渠道
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /admin/channels/{id}/models/batch-reprice:
    post:
      tags: [admin]
      summary: 批量保存系统渠道模型最终销售价
      description: |
        仅管理员可用。接收浏览器计算或手工修改后的最终售价及原始价格版本，不在服务端重算。
        前端按成本/(1−利润率)计算，支持0–6位积分小数四舍五入及重新计算。
        必须提交所选模型全部已启用规格，不改变成本、规格启停或模型启停。
        当前计费方式的价格字段必须完整且不能多余，价格为非负整数微积分，null无效。
        缺少成本/售价配置、重复或失效 ID、越权、超限价格、过期版本或并发版本冲突均整批拒绝。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [models]
              properties:
                models:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [modelId, priceVersion, priceTiers]
                    properties:
                      modelId: { type: string, minLength: 1 }
                      priceVersion: { type: integer, format: int64, minimum: 1 }
                      priceTiers:
                        type: array
                        minItems: 1
                        items:
                          type: object
                          required: [id, priceVersion, prices]
                          properties:
                            id: { type: string, minLength: 1 }
                            priceVersion:
                              { type: integer, format: int64, minimum: 1 }
                            prices:
                              type: object
                              additionalProperties: false
                              description: 按次/秒仅unit字段；文本Token为输入、输出、缓存命中、缓存写入；视频Token仅输出。必须完整提交对应字段。
                              properties:
                                unitPriceMicrocredits:
                                  {
                                    type: integer,
                                    format: int64,
                                    minimum: 0,
                                    maximum: 9007199254740991,
                                  }
                                inputTokenPriceMicrocredits:
                                  {
                                    type: integer,
                                    format: int64,
                                    minimum: 0,
                                    maximum: 1000000000000,
                                  }
                                outputTokenPriceMicrocredits:
                                  {
                                    type: integer,
                                    format: int64,
                                    minimum: 0,
                                    maximum: 1000000000000,
                                  }
                                cachedTokenPriceMicrocredits:
                                  {
                                    type: integer,
                                    format: int64,
                                    minimum: 0,
                                    maximum: 1000000000000,
                                  }
                                cacheWriteTokenPriceMicrocredits:
                                  {
                                    type: integer,
                                    format: int64,
                                    minimum: 0,
                                    maximum: 1000000000000,
                                  }
            example:
              {
                models:
                  [
                    {
                      modelId: MODEL001,
                      priceVersion: 4,
                      priceTiers:
                        [
                          {
                            id: TIER001,
                            priceVersion: 8,
                            prices: { unitPriceMicrocredits: 1370000 },
                          },
                        ],
                    },
                  ],
              }
      responses:
        "200":
          description: 更新成功，data.updated 为更新的模型数量
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, enum: [0] }
                  msg: { type: string }
                  data:
                    type: object
                    properties:
                      updated: { type: integer }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /admin/channels/{id}/models/batch-protocol:
    post:
      tags: [admin]
      summary: 批量修改系统渠道模型的调用协议
      description: |
        仅管理员可用。把同一系统渠道内所选模型切换到同一调用协议；协议能力必须与每个模型的能力一致。
        保留原能力配置与价格档，只按新协议重新规范化并校验；任一模型不兼容、已删除或被并发修改时整批拒绝。
