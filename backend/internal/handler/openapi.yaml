    AgentRunID:
      name: id
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: open_ai_canvas_session
  schemas:
    ThinkingRequest:
      type: string
      enum: ["", auto, deep, off, minimal, low, medium, high, max]
      description: 空串或省略等同 auto（模型默认）；deep 取模型支持的最高非 max 档位。具体档位按实际渠道模型的思考能力归一，不改变计价。
    CanvasTextOptions:
      type: object
      properties:
        stream:
          type: boolean
        thinkingLevel:
          $ref: "#/components/schemas/ThinkingRequest"
    CreateTaskRequest:
      type: object
      required: [type]
      properties:
        projectId: { type: string }
        type: { type: string }
        operation: { type: string }
        prompt: { type: string }
        provider: { type: string }
        model: { type: string }
        logicalModelId: { type: string }
        input:
          type: object
          description: 按任务模式传入参数；模型、渠道、协议与计价由服务端重新校验。电商文本阶段的思考意图由后台阶段配置覆盖。
          properties:
            mode: { type: string }
            textOptions:
              $ref: "#/components/schemas/CanvasTextOptions"
          additionalProperties: true
    FeedbackAttachment:
      type: object
      required: [id, name, type, url, size, mimeType]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [image, video] }
        url: { type: string }
        size: { type: integer, format: int64, minimum: 0 }
        mimeType: { type: string }
    UserFeedback:
      type: object
      required:
        [
          id,
          userId,
          userName,
          userEmail,
          contact,
          type,
          title,
          content,
          attachments,
          environment,
          status,
          adminReply,
          archived,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string }
        userId: { type: string }
        userName: { type: string }
        userEmail: { type: string }
        contact: { type: string }
        type: { type: string, enum: [bug, feature, improvement, other] }
        title: { type: string, description: 最多 200 个 UTF-8 字节 }
        content: { type: string, description: 最多 10000 个 UTF-8 字节 }
        attachments:
          {
            type: string,
            description: JSON-encoded array of FeedbackAttachment,
          }
        environment:
          { type: string, description: JSON-encoded client environment object }
        status:
          {
            type: string,
            enum: [pending, processing, resolved, closed, archived],
          }
        adminReply: { type: string }
        repliedAt: { type: string, format: date-time, nullable: true }
        archived: { type: boolean }
        archivedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    FeedbackSubmission:
      type: object
      required: [title, content]
      properties:
        type: { type: string, enum: [bug, feature, improvement, other] }
        title:
          { type: string, minLength: 1, description: 最多 200 个 UTF-8 字节 }
        content:
          { type: string, minLength: 1, description: 最多 10000 个 UTF-8 字节 }
        contact: { type: string }
        attachments:
          {
            type: string,
            description: JSON-encoded array of FeedbackAttachment,
          }
        environment:
          { type: string, description: JSON-encoded client environment object }
    FeedbackAdminUpdate:
      type: object
      properties:
        status: { type: string, enum: [pending, processing, resolved, closed] }
        adminReply: { type: string }
        archived: { type: boolean }
    FeedbackListResult:
      type: object
      required: [list, total, page, limit]
      properties:
        list:
          { type: array, items: { $ref: "#/components/schemas/UserFeedback" } }
        total: { type: integer, format: int64 }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 100 }

    LoginLog:
      type: object
      properties:
        id: { type: string }
        userId: { type: string, nullable: true }
        username: { type: string, description: 事件时用户名快照 }
        displayName: { type: string }
        account: { type: string, description: 用户名或脱敏的尝试账号 }
        event: { type: string, enum: [login, logout] }
        method:
          {
            type: string,
            enum: [password, email, sms, linuxdo, oidc, verification, unknown],
          }
        source: { type: string, enum: [login, registration, logout] }
        result: { type: string, enum: [success, failed] }
        ip: { type: string }
        userAgent:
          {
            type: string,
            maxLength: 512,
            description: 客户端自报信息，不作为身份判断依据,
          }
        sessionRef:
          {
            type: string,
            description: 会话 ID 的单向哈希，仅关联历史事件，不含 Token,
          }
        reason: { type: string }
        message: { type: string }
        createdAt: { type: string, format: date-time }
    ToolMutation:
      type: object
      required: [type, label, prompt]
      properties:
        type: { type: string, enum: [style, motion, nine_grid, effect] }
        label: { type: string, description: 名称最多 120 字节 }
        prompt:
          { type: string, description: 最多 8000 字节，不允许嵌套工具标签 }
        visibility: { type: string, enum: [private, public], default: private }
        desc: { type: string }
        tag: { type: string }
        cover:
          { type: string, description: 本人已上传完成的资源 URL，仅限私有工具 }
        mediaUrl:
          { type: string, description: 本人已上传完成的资源 URL，仅限私有工具 }
        extraInfo: { type: array, items: { type: string } }
        ratio: { type: string }
    ModelRequestIntent:
      type: object
      required: [capability]
      properties:
        capability:
          type: string
          enum: [text, image, video, audio]
        operation:
          type: string
          description: 可选生成操作，必须符合所选模型的能力合同
        inputs:
          type: object
          description: 按素材类型统计的参考数量，如 image、video、audio；另受所选模型的数量上限约束
          additionalProperties:
            type: integer
            minimum: 0
            maximum: 128
        options:
          type: object
          description: 当前创作规格；未指定的参数使用服务端默认值
          additionalProperties: true
          example:
            vquality: 720p
            size: "16:9"
            videoSeconds: 5
            videoGenerateAudio: true
        referenceVideoDurationsMs:
          type: array
          description: 仅报价使用；按顺序给出参考视频时长（毫秒），长度必须等于 inputs.video。省略时按 15 秒上限预估。真实任务不读取该字段，按秒计费的参考视频时长由后端实测
          items:
            type: integer
            format: int64
            minimum: 1
            maximum: 3600000
    LogicalModelQuote:
      type: object
      required:
        [logicalModelId, billingMode, quantity, amountMicrocredits, estimated]
      properties:
        logicalModelId:
          type: string
          description: 前台逻辑模型 ID；直接查询系统渠道模型时为空字符串
        billingMode:
          type: string
          enum: [fixed_request, per_second, token]
        quantity:
          type: integer
          format: int64
          minimum: 1
          description: 按次为 1，按秒为生成秒数，按 Token 为预留用量（视频含平台预留余量）
        amountMicrocredits:
          type: integer
          format: int64
          minimum: 0
          description: 预估预留微积分，1000000 微积分等于 1 积分；明确配置的免费价格返回 0
        estimated:
          type: boolean
          description: Token 计费为 true；优先有效上游 usage，视频无有效用量时按提交的公式快照结算，预留不构成费用上限
        videoTokenEstimate:
          $ref: "#/components/schemas/VideoTokenEstimate"
        referenceVideo:
          $ref: "#/components/schemas/QuoteReferenceVideo"
    QuoteReferenceVideo:
      type: object
      description: 仅按秒或视频 Token 计费的视频请求挂参考视频时返回（按次计费不返回），用于展示“生成 N 秒 + 参考视频 M 秒”的报价构成
      required:
        [count, billed, generatedSeconds, referenceSeconds, billedSeconds, estimated]
      properties:
        count: { type: integer, minimum: 1 }
        billed:
          type: boolean
          description: true 表示模型开启参考视频计费，本次按带参考视频价格计入参考视频；false 表示参考视频不计费
        generatedSeconds: { type: integer, format: int64, minimum: 0 }
        referenceSeconds:
          type: number
          description: 参考视频总秒数；计费时为计入的秒数，不计费时为已知时长（未知为 0）
        billedSeconds:
          type: integer
          format: int64
          minimum: 0
          description: 按秒计费时计入数量的参考视频秒数（向上取整）；Token 计费为 0
        estimated:
          type: boolean
          description: 参考视频时长未知，按 15 秒上限预估
    VideoTokenEstimate:
      type: object
      description: 仅视频 Token 报价返回；将火山公式用量和平台预留余量分开披露
      required:
        [
          formulaTokens,
          reservedTokens,
          outputWidth,
          outputHeight,
          framesPerSecond,
          outputSeconds,
          referenceSeconds,
          referenceDurationEstimated,
          dimensionsEstimated,
          reservationMarginPercent,
        ]
      properties:
        formulaTokens:
          type: integer
          format: int64
          minimum: 1
          description: 按（参考视频总秒数 + 输出秒数）× 输出宽 × 输出高 × 帧率 / 1024 向上取整；上游最低计费用量可能更高
        reservedTokens:
          type: integer
          format: int64
          minimum: 1
          description: 公式用量叠加平台预留余量后向上取整
        outputWidth:
          type: integer
          format: int64
          minimum: 1
        outputHeight:
          type: integer
          format: int64
          minimum: 1
        framesPerSecond:
          type: integer
          format: int64
          minimum: 1
        outputSeconds:
          type: integer
          format: int64
          minimum: 1
        referenceSeconds:
          type: number
          format: double
          minimum: 0
          description: 计入公式的参考视频总秒数；报价仅有参考数量时采用预估时长
        referenceDurationEstimated:
          type: boolean
          description: 参考时长未知、使用预估值时为 true
        dimensionsEstimated:
          type: boolean
          description: 自适应画幅或上游型号无法确定，使用预估像素尺寸时为 true
        reservationMarginPercent:
          type: integer
          format: int64
          minimum: 0
          description: 平台预留余量百分比，不属于火山官方计费公式
    ModelQuoteEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [data]
          properties:
            code:
              type: integer
              enum: [0]
            data:
              type: object
              required: [quote]
              properties:
                quote:
                  $ref: "#/components/schemas/LogicalModelQuote"
    AgentMemoryStep:
      type: object
      required: [tool, action]
      properties:
        tool: { type: string }
        action: { type: string }
        note: { type: string }
    AgentMemoryEvidence:
      type: object
      required: [sequence, tool]
      properties:
        sequence: { type: integer, minimum: 0 }
        callId: { type: string }
        tool: { type: string }
    AgentMemory:
      type: object
      description: 用户私有记忆；来源事件只说明产生依据，不证明经验已验证有效；计数不是效果评分
      required:
        [
          id,
          topic,
          category,
          situation,
          status,
          hits,
          injected,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string }
        topic: { type: string }
        category: { type: string }
        situation: { type: string }
        lesson: { type: string }
        steps:
          type: array
          items: { $ref: "#/components/schemas/AgentMemoryStep" }
        source: { type: string }
        originRunId: { type: string }
        evidence:
          type: array
          maxItems: 8
          items: { $ref: "#/components/schemas/AgentMemoryEvidence" }
        status: { type: string, enum: [pending, approved, rejected, expired] }
        hits:
          {
            type: integer,
            format: int64,
            minimum: 0,
            description: 主动查阅次数，不等同成功次数,
          }
        injected:
          {
            type: integer,
            format: int64,
            minimum: 0,
            description: 含该条目的模型任务实际入队次数,
          }
        lastVerifiedAt:
          {
            type: string,
            format: date-time,
            description: 原始验证时间；新建、去重、压缩及批准不刷新,
          }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AgentMemoryCompactSummary:
      type: object
      required: [rewritten, merged, removed, skipped]
      properties:
        rewritten: { type: integer, minimum: 0 }
        merged: { type: integer, minimum: 0 }
        removed: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0 }
    AgentMemoryCompactView:
      type: object
      required: [compactInterval, lastStatus]
      properties:
        compactInterval: { type: string, enum: [off, daily, weekly, monthly] }
        logicalModelId: { type: string }
        channelId: { type: string }
        channelModelKey: { type: string }
        model: { type: string }
        taskId: { type: string }
        proposalId: { type: string }
        lastCompactAt: { type: string, format: date-time }
        lastStatus:
          type: string
          enum:
            [
              idle,
              queued,
              running,
              awaiting_review,
              applied,
              rejected,
              restored,
              succeeded,
              failed,
            ]
          description: awaiting_review只表示提案生成；applied表示本人批准后已应用；succeeded表示本批无可应用修改
        lastError: { type: string }
        summary: { $ref: "#/components/schemas/AgentMemoryCompactSummary" }
    AgentMemoryChange:
      type: object
      required: [kind, before, after]
      properties:
        kind: { type: string, enum: [rewrite, merge] }
        before:
          type: array
          minItems: 1
          maxItems: 80
          items: { $ref: "#/components/schemas/AgentMemory" }
        after: { $ref: "#/components/schemas/AgentMemory" }
    AgentMemoryProposal:
      type: object
      required: [id, status, version, summary, changes, createdAt]
      properties:
        id: { type: string }
        status:
          {
            type: string,
            enum: [generating, pending, approved, rejected, no_changes, failed],
          }
        version: { type: integer, format: int64, minimum: 1 }
        taskId: { type: string }
        summary: { $ref: "#/components/schemas/AgentMemoryCompactSummary" }
        changes:
          type: array
          maxItems: 80
          items: { $ref: "#/components/schemas/AgentMemoryChange" }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time }
    AgentMemoryProposalDecision:
      type: object
      additionalProperties: false
      required: [decision, version]
      properties:
        decision: { type: string, enum: [approve, reject] }
        version:
          {
            type: integer,
            format: int64,
            minimum: 1,
            description: 列表中读到的提案版本,
          }
    AgentMemoryRevision:
      type: object
      required: [id, proposalId, version, before, after, createdAt]
      properties:
        id: { type: string }
        proposalId: { type: string }
        version: { type: integer, format: int64, minimum: 1 }
        before:
          type: array
          maxItems: 80
          items: { $ref: "#/components/schemas/AgentMemory" }
        after:
          type: array
          maxItems: 80
          items: { $ref: "#/components/schemas/AgentMemory" }
        createdAt: { type: string, format: date-time }
        restoredAt: { type: string, format: date-time }
    AgentMemoryRevisionRestore:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          {
            type: integer,
            format: int64,
            minimum: 1,
            description: 列表中读到的恢复版本；当前内容也必须匹配应用后快照,
          }
    AgentCanvasUndoReceipt:
      type: object
      required: [runId, canvasId, stepId, expectedSnapshotHash]
      properties:
        runId: { type: string, description: 产生本次画布变更的原运行ID }
        canvasId: { type: string, description: 产生本次变更的画布 }
        stepId: { type: string }
        expectedSnapshotHash:
          {
            type: string,
            minLength: 64,
            maxLength: 64,
            pattern: "^[0-9a-fA-F]{64}$",
          }
    AgentCanvasUpdatedPayload:
      type: object
      required: [canvasId, operation, callId]
      properties:
        canvasId: { type: string }
        operation: { type: string }
        callId: { type: string }
        requiresRefresh: { type: boolean }
        canvasPatch: { type: object, additionalProperties: true }
        actions:
          { type: array, items: { type: object, additionalProperties: true } }
        undo:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AgentCanvasUndoReceipt"
          description: 仅有完整快照的未提交收费普通写入携带；不能替代服务端最新变更和完整哈希校验
    AgentProfileRequest:
      type: object
      additionalProperties: false
      required: [scope, content, revision]
      properties:
        scope:
          type: string
          enum: [user, project, canvas]
        projectId:
          type: string
        canvasId:
          type: string
        content:
          type: string
          description: 常驻偏好文档，最多 12000 个 Unicode 字符；不能授权节点、工具、预算或绕过审批
        revision:
          type: integer
          minimum: 0
          description: 待更新层的数字 revision；首次创建为 0
    CloudAgentRequest:
      type: object
      additionalProperties: false
      required: [canvasId, prompt, permissionMode, contextScope, budget, idempotencyKey]
      properties:
        canvasId:
          type: string
          maxLength: 80
        prompt:
          type: string
          description: 非空，最多 16000 字节
        logicalModelId:
          type: string
        model:
          type: string
        channelId:
          type: string
        channelModelKey:
          type: string
        permissionMode:
          type: string
          enum: [read_only, request_approval, auto]
        subagentEnabled:
          type: boolean
        subagentWriteEnabled:
          type: boolean
        storyboardDisabled:
          type: boolean
        reasoningMode:
          type: string
          enum: [off, auto, deep, minimal, low, medium, high, max]
          description: 本轮推理策略；供应商是否支持由后端校验
        skillIds:
          type: array
          maxItems: 16
          items:
            type: string
          description: 用户为对话固定或在本条消息里点名的技能；其余已安装且 agentMode=auto 的技能由 Agent 按技能目录自动发现
        contextScope:
          type: array
          maxItems: 1
          items:
            type: string
            enum: [canvas]
        budget:
          type: object
          additionalProperties: false
          required: [maxCredits]
          properties:
            maxCredits:
              type: number
              minimum: 0
              exclusiveMinimum: true
              maximum: 1000000
            maxGenerationTasks:
              type: integer
              minimum: 0
              maximum: 8
            maxVideoSeconds:
              type: integer
              minimum: 0
              maximum: 120
            maxSteps:
              type: integer
              minimum: 0
              maximum: 9999
              description: 0 表示本次请求不另设上限；仍受后台执行策略限制
        idempotencyKey:
          type: string
          minLength: 8
          maxLength: 128
    Envelope:
      type: object
      required: [code, msg]
      properties:
        code:
          type: integer
          description: 0 成功；失败时默认等于 HTTP 状态，或 status*100+n 的细分码
        data: {}
        msg:
          type: string
        reason:
          type: string
          description: 仅失败时出现。稳定机器可读原因。
    ErrorEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            code:
              type: integer
              enum:
                [
                  400,
                  401,
                  403,
                  404,
                  409,
                  429,
                  500,
                  502,
                  503,
                  504,
                  40301,
                  40302,
                  40901,
                  42901,
                ]
            data:
              nullable: true
            reason:
              type: string
              enum:
                - invalid_argument
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - project_name_conflict
                - skill_version_conflict
                - failed_precondition
                - quota_exceeded
                - storage_capacity_exceeded
                - storage_read_only
                - rate_limited
                - unavailable
                - timeout
                - internal
                - bad_gateway
                - upstream_dns_failed
                - model_capability_not_supported
                - model_price_not_configured
                - model_route_unavailable
                - provider_request_failed
                - model_catalog_mismatch
                - invalid_model_selection
    AgentConversationMessageRequest:
      type: object
      additionalProperties: false
      required: [mode, expectedRunId, request]
      properties:
        mode: { type: string, enum: [interject, queue] }
        expectedRunId: { type: string, maxLength: 80 }
        replyToQuestionId: { type: string, maxLength: 160 }
        request:
          $ref: "#/components/schemas/CloudAgentRequest"
    PlatformErrorEnvelope:
      type: object
      required: [code, data, msg, reason]
      properties:
        code: { type: integer }
        data: { nullable: true }
        msg: { type: string }
        reason:
          type: string
          description: 创作平台合同错误码
          enum: [invalid_request, unauthorized, forbidden, not_found, model_unavailable, model_not_supported, reference_unavailable, insufficient_credits, cost_limit_exceeded, quote_expired, idempotency_conflict, active_task_limit, action_not_allowed, billing_pending_review, media_delivery_failed, unavailable, internal]
        details:
          type: object
          properties:
            retryable: { type: boolean }
            taskId: { type: string }
            requestId: { type: string }
    PlatformGenerationRequest:
      type: object
      required: [contractVersion, capability, model, prompt, business, idempotencyKey]
      properties:
        contractVersion: { type: integer, enum: [1] }
        capability: { type: string, enum: [text, image, video, audio] }
        operation: { type: string }
        model:
          type: object
          description: logicalModelId 与 channelId+modelKey 二选一
          properties:
            logicalModelId: { type: string }
            channelId: { type: string }
            modelKey: { type: string }
        prompt: { type: string }
        parameters: { type: object, additionalProperties: true }
        references:
          type: array
          items:
            type: object
            required: [resourceId, kind]
            properties:
              resourceId: { type: string }
              kind: { type: string, enum: [image, video, audio] }
              role: { type: string }
        business:
          type: object
          required: [application]
          properties:
            application: { type: string, enum: [canvas, drama, ecommerce, test] }
            projectId: { type: string }
            objectType: { type: string }
