  /agent/runs/{id}/director-preview:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
    post:
      tags: [agent]
      summary: 回传导演台浏览器预演录制结果
      description: 前端导演台在收到 director_open（action=preview）事件后录制白模预演，用本接口回传结果并恢复 Agent 挂起的 director 调用。requestId 取自事件；videoResourceId 与 error 必须且只能提供一个，视频资源须为当前用户已就绪的视频。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId]
              properties:
                requestId:
                  type: string
                  maxLength: 120
                videoResourceId:
                  type: string
                error:
                  type: string
                  maxLength: 500
      responses:
        "200":
          description: "信封 data 为 { accepted: true }"
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: integer, enum: [0]}
                  msg: {type: string}
                  data:
                    type: object
                    required: [accepted]
                    properties:
                      accepted: {type: boolean, enum: [true]}
        "400":
          description: 请求无效、videoResourceId 与 error 未二选一，或视频资源不存在、未就绪、不属于当前用户
        "401":
          description: 未登录
        "404":
          description: "reason=director_preview_not_found：运行不存在或不属于当前用户，或 requestId 未知、已完成、已超时"
  /agent/runs/{id}/permission:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
    post:
      tags: [agent]
      summary: 运行中切换 Agent 执行权限
      description: 放宽与收紧都从下一次工具调用生效；正在等待的审批仍需用户批准或拒绝。模型在下一步收到一条权限变更系统通知，系统提示与 prompt cache 键不变。同一 requestId 重放返回原结果；与当前权限相同时直接成功。生成预算不随权限改变。成功后运行事件流出现 permission_changed（from、to、requestId）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [permissionMode, requestId]
              properties:
                permissionMode:
                  type: string
                  enum: [read_only, request_approval, auto]
                requestId:
                  type: string
                  maxLength: 160
      responses:
        "200":
          description: 信封 data.permissionMode 为当前生效权限，data.changed 表示本次是否切换
        "400":
          description: 权限值或 requestId 无效
        "404":
          description: 运行不存在或不属于当前用户
        "409":
          description: 运行已结束（reason 为 agent_run_finished）、子代理权限固定为只读（reason 为 agent_subagent_permission_fixed）或写入冲突
  /canvas-projects/{id}/storyboard/split:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      tags: [canvas]
      summary: 用拆镜脚本生成或局部重拆分镜表
      description: 服务端从画布读取剧情（分镜节点输入框）、连到分镜节点的文本节点（项目风格与用户要求）、角色卡和可引用素材，组装固定提示词后提交文本任务；任务结束由服务端写回分镜行。rowIds 非空表示局部重拆这几行，必须连续且未锁定，脚本会读取前后各一镜衔接。锁定行与范围外的行不改；一对一改写保留行 ID 与媒体并标 mediaReview=pending；行数变化时旧媒体只解绑不删除。quoteOnly 为 true 时只报价，不提交、不改画布。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nodeId]
              properties:
                nodeId: { type: string }
                rowIds: { type: array, maxItems: 100, items: { type: string } }
                request: { type: string, maxLength: 4000, description: 用户的修改意见或本次要求 }
                shotCount: { type: integer, minimum: 0, maximum: 100 }
                shotDurationSeconds: { type: integer, minimum: 0, maximum: 60 }
                skillContext: { type: string, description: 写作方法上下文，只提供方法，不改变剧情与输出结构 }
                logicalModelId: { type: string }
                config: { type: object, additionalProperties: true, description: 文本模型选择（channelId、model 等） }
                quoteOnly: { type: boolean }
                quoteHash: { type: string, description: 正式提交必填，原样复制五分钟内且输入和价格未变化的报价回执 }
                operationId: { type: string }
                clientId: { type: string }
      responses:
        "200":
          description: 信封 data 为 { taskId, quote, rowIds, partial }；只报价时没有 taskId；quote 包含 quoteHash 和 expiresAt
        "409":
          description: 缺少确认报价，报价过期、价格或上下文变化，或同一操作标识用于不同请求
        "400":
          description: 分镜节点缺少剧情、范围包含锁定或不连续的行、参数越界或模型选择无效
        "401":
          description: 未登录
        "404":
          description: 画布不存在或不属于当前用户
  /canvas-projects/{id}/reference-migration:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [canvas]
      summary: 预览旧版画布的引用规范化
      description: 只读，不写文档。required 为 false 表示画布已使用声明式引用；conflicts 列出字段与旧连线不一致、需要用户选择来源的作用域。
      responses:
        "200":
          description: 信封 data 为 { revision, required, conflicts[{ scopeKey, fieldNodeIds, edgeNodeIds }] }
        "401":
          description: 未登录
        "404":
          description: 画布不存在或不属于当前用户
    post:
      tags: [canvas]
      summary: 执行旧版画布的引用规范化
      description: 按 revision 做并发校验，冲突作用域必须全部给出来源后才写入；写入前保留一份画布历史快照（reason before_reference_migration），写入后画布带 referenceFieldsVersion 1，其他标签页经画布变更通知更新。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision: { type: integer, format: int64, minimum: 0 }
                choices:
                  type: object
                  description: 冲突作用域 scopeKey 到来源的映射，取值 fields 或 connections
                  additionalProperties: { type: string, enum: [fields, connections] }
      responses:
        "200":
          description: 信封 data.project 返回迁移后的画布摘要
        "400":
          description: 来源取值无效，或引用无法解析（reason reference_migration_invalid）
        "401":
          description: 未登录
        "404":
          description: 画布不存在或不属于当前用户
        "409":
          description: 画布已有更新、仍有冲突未选择（reason reference_migration_conflict）或已完成规范化（reason reference_migration_not_required）
        "428":
          description: 缺少 revision
  /skills/install:
    post:
      tags: [skills]
      summary: 安装上传的单技能或技能合集
      description: 整包重新校验后在同一事务创建所有技能；保持各技能独立目录和版本，不覆盖已有同名技能。最多 64 个技能、合计 512 个文件；压缩和解压后均不超过 20MB，单文件不超过 8MB。不展开嵌套 ZIP。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
                sourceType: {type: string, enum: [markdown, zip]}
                name: {type: string, description: 仅单技能可覆盖名称}
                description: {type: string, description: 仅单技能可覆盖简介}
                tag: {type: string}
                isPrivate: {type: boolean}
      responses:
        "200":
          description: data 为 skills 数组与 ignoredFileCount；仅安装一项时另外返回 skill。
          content:
            application/json:
              schema:
                type: object
                required: [code, data]
                properties:
                  code: {type: integer, enum: [0]}
                  data:
                    type: object
                    required: [skills, ignoredFileCount]
                    properties:
                      ignoredFileCount: {type: integer, minimum: 0}
                      skill: {type: object, description: 单项安装的技能详情}
                      skills:
                        type: array
                        minItems: 1
                        maxItems: 64
                        items:
                          type: object
                          required: [skillId, skillName, versionId, description]
                          properties:
                            skillId: {type: string}
                            skillName: {type: string}
                            versionId: {type: string}
                            description: {type: string}
        "400": {description: 包无效、合集内重名、统一覆盖名称或超过容量；不创建部分技能}
        "401": {description: 未登录}
  /skills/install/preview:
    post:
      tags: [skills]
      summary: 识别上传的单技能或技能合集
      description: 仅解析，不创建技能、版本或文件包；ZIP 中的各个 SKILL.md 分别识别，技能目录外的文件计入 ignoredFileCount。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
                sourceType: {type: string, enum: [markdown, zip]}
      responses:
        "200":
          description: data 包含 skills、ignoredFileCount、totalBytes；skills 每项为 entryPath、name、description、version、fileCount、totalBytes。
          content:
            application/json:
              schema:
                type: object
                required: [code, data]
                properties:
                  code: {type: integer, enum: [0]}
                  data:
                    type: object
                    required: [skills, ignoredFileCount, totalBytes]
                    properties:
                      ignoredFileCount: {type: integer, minimum: 0}
                      totalBytes: {type: integer, format: int64, minimum: 0}
                      skills:
                        type: array
                        minItems: 1
                        maxItems: 64
                        items:
                          type: object
                          required: [entryPath, name, description, version, fileCount, totalBytes]
                          properties:
                            entryPath: {type: string}
                            name: {type: string}
                            description: {type: string}
                            version: {type: string}
                            fileCount: {type: integer, minimum: 1}
                            totalBytes: {type: integer, format: int64, minimum: 0}
        "400": {description: 文件、目录、技能元数据或容量不符合要求}
        "401": {description: 未登录}
