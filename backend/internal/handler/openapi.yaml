      responses:
        "200":
          description: 更新成功，data.updated 为更新的模型数量
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, enum: [0] }
                  msg: { type: string }
                  data:
                    type: object
                    properties:
                      updated: { type: integer }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /admin/channel-models/batch-reprice:
    post:
      tags: [admin]
      summary: 跨系统渠道批量保存模型最终销售价
      description: |
        仅管理员可用。请求结构与校验规则同 `/admin/channels/{id}/models/batch-reprice`，
        但所选模型可来自不同系统渠道；不属于系统渠道或已删除的模型整批拒绝。
      requestBody:
