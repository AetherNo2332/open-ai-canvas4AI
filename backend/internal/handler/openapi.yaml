                      data: {$ref: "#/components/schemas/ProjectAssetSyncState"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409":
          description: 版本已过期，无副作用；reason 为 project_asset_sync_conflict，retryable 为 true
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: "#/components/schemas/ErrorEnvelope"}
