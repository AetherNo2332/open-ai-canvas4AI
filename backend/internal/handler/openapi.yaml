    post:
      tags: [resources]
      summary: 上传资源文件
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "403":
          description: 配额用尽（code=40301, reason=quota_exceeded 或 storage_capacity_exceeded）；账号只读（code=40302, reason=storage_read_only）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /resources/access:
    post:
      tags: [resources]
      summary: 批量签发当前用户资源访问描述
      description: 统一处理展示、下载、复制、浏览器字节处理和模型输入；客户端不能通过查询参数选择 direct/proxy。每项独立成功或失败。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 100
              items:
                type: object
                required: [resourceId]
                properties:
                  resourceId: { type: string }
                  purpose:
                    {
                      type: string,
                      enum:
                        [
                          display,
                          copy,
                          download,
                          browser-process,
                          provider-input,
                        ],
                      default: display,
                    }
                  variant:
                    {
                      type: string,
                      enum: [original, playback],
                      default: original,
                    }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /resources/{id}/file:
    get:
      tags: [resources]
      summary: 读取资源二进制（非 JSON 信封）
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: access
          schema: { type: string, enum: ["1"] }
          description: 仅返回统一访问描述，不返回文件正文。
        - in: query
          name: variant
          schema:
            { type: string, enum: [original, playback], default: original }
        - in: query
          name: purpose
          schema:
            {
              type: string,
              enum: [display, download, browser-process],
              default: display,
            }
      responses:
        "200":
          description: 文件流
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /workbench/tools:
    get:
      tags: [workbench]
      summary: 获取当前用户可用的工作台工具
      parameters:
        - in: query
          name: kind
          required: true
          schema: { type: string, enum: [image, video] }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /workbench/tasks:
    get:
      tags: [workbench]
      summary: 查询当前用户的工作台任务
      parameters:
        - in: query
          name: kind
          required: true
          schema: { type: string, enum: [image, video] }
        - in: query
          name: activeOnly
          schema: { type: boolean, default: false }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      tags: [workbench]
      summary: 创建工作台生成任务
      description: 仅接受模型选择意图、资源 ID、提示词和允许的生成参数；toolId 可选，服务端校验开关、所选工具、资源、模型能力和账单，不接受客户端 providerConfig、密钥或上游 URL。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, prompt, model]
              properties:
                kind: { type: string, enum: [image, video] }
                ecommerceProjectId:
                  type: string
                  description: 电商工作台提交时关联当前用户的电商项目；服务端校验归属，并对新生成应用电商总开关，图片还需生图开关，视频还需电商视频与原视频开关。
                toolId: { type: string }
                presetId: { type: string }
                prompt: { type: string, minLength: 1, maxLength: 32000 }
                model: { type: string }
                logicalModelId: { type: string }
                channelId:
                  {
                    type: string,
                    description: 系统渠道模型没有 logicalModelId 时提交渠道 ID，二者至少一个,
                  }
                batch:
                  type: object
                  additionalProperties: false
                  description: 同一次提交拆出的多个任务共用一个批次 ID，只用于列表分组展示；每个任务仍各自准入和计费。列表项通过 clientContext.batchId/batchIndex/batchCount 返回。
                  required: [id, index, count]
                  properties:
                    id: { type: string, pattern: "^[A-Za-z0-9_-]{8,64}$" }
                    index: { type: integer, minimum: 0 }
                    count: { type: integer, minimum: 1, maximum: 20 }
                modelChoice:
                  type: object
                  additionalProperties: false
                  properties:
                    logicalModelId: { type: string }
                    modelName: { type: string }
                workbench:
                  type: object
                  additionalProperties: false
                  properties:
                    kind: { type: string, enum: [image, video] }
                    toolId: { type: string }
                    presetId: { type: string }
                parameters:
                  type: object
                  additionalProperties: false
                  properties:
                    size: { type: string }
                    quality: { type: string }
                    imageResolution: { type: string }
                    count: { type: integer, minimum: 1, maximum: 20 }
                    seconds: { type: integer, minimum: 1 }
                    ratio: { type: string }
                    resolution: { type: string }
                    generateAudio: { type: boolean }
                    watermark: { type: boolean }
                references:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    additionalProperties: false
                    required: [resourceId, kind]
                    properties:
                      resourceId: { type: string }
                      kind: { type: string, enum: [image, video, audio] }
                      role:
                        {
                          type: string,
                          enum: [reference, first_frame, last_frame],
                        }
                      slotKey: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
