        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resourceId]
              properties:
                resourceId: { type: string }
                taskId: { type: string }
                cascade: { type: boolean }
                expectedRevision: { type: integer, format: int64 }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /admin/agent/workers:
    get:
      tags: [admin]
      summary: 列出已配置 Agent worker 身份（管理员）
      description: 返回 worker ID、作用用户、创建与撤销时间；不返回 bearer credential 或其哈希。
      responses:
        '200': {description: 信封 data.workers，列表不含 bearer credential}
        '403': {$ref: '#/components/responses/Error'}
    post:
      tags: [admin]
      summary: 配置 Agent worker 身份并签发一次性凭据（管理员）
      description: 响应中的 credential 仅此一次可见，响应使用 Cache-Control no-store；调用方不得将其写入日志、URL 或持久任务正文。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id]
              properties:
                id: {type: string, description: worker 身份 ID}
                userId: {type: string, description: 留空表示全局 worker；指定后只领取该用户任务}
      responses:
        '200': {description: 信封 data 包含 id、userId、仅此一次返回的 bearer credential；不得记录在日志中}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /admin/agent/workers/{id}:
    delete:
      tags: [admin]
      summary: 撤销 Agent worker 身份（管理员）
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        '200': {description: 信封 data.revoked 为 true}
        '403': {$ref: '#/components/responses/Error'}
  /admin/settings/agent-web-search:
    get:
      tags: [admin]
      summary: 读取联网搜索配置（管理员，密钥仅返回是否已配置）
      responses:
        '200': {description: 返回 setting，包含 enabled、hasApiKey、revision、updatedAt}
        '403': {$ref: '#/components/responses/Error'}
    put:
      tags: [admin]
      summary: 保存联网搜索配置（管理员）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision]
              properties:
                enabled: {type: boolean}
                apiKey: {type: string, description: 仅写入，不在读取响应中返回}
                clearApiKey: {type: boolean}
                expectedRevision: {type: integer, format: int64, minimum: 0}
      responses:
        '200': {description: 返回更新后的脱敏 setting}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /admin/settings/agent-scheduler:
    get:
      tags: [admin]
      summary: 读取 Agent 调度配置（管理员）
      responses:
        '200': {description: "返回 setting：dispatchConcurrency、maxResidentSessions、maxResidentPerUser、maxResidentPerCanvas、revision、updatedAt"}
        '403': {description: 无管理员权限}
    put:
      tags: [admin]
      summary: 保存 Agent 配置并广播热更新事件
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision, dispatchConcurrency, maxResidentSessions, maxResidentPerUser, maxResidentPerCanvas]
              properties:
                expectedRevision: {type: integer, format: int64, minimum: 0}
                dispatchConcurrency: {type: integer, minimum: 1, maximum: 16}
                maxResidentSessions: {type: integer, minimum: 1, maximum: 64}
                maxResidentPerUser: {type: integer, minimum: 1, maximum: 64, description: "同一用户跨画布、跨执行器的有效租约上限"}
                maxResidentPerCanvas: {type: integer, minimum: 1, maximum: 64}
      responses:
        '200': {description: 已持久化，返回新版 setting；执行器应用状态另行查询}
        '400': {description: 非法参数或额度关系}
        '403': {description: 无管理员权限}
        '409': {description: 配置版本已变更，请刷新}
  /admin/settings/agent-scheduler/status:
    get:
      tags: [admin]
      summary: 读取脱敏 Agent 执行器运行状态（管理员）
      responses:
        '200': {description: "返回 instances：instanceId、resident、capacity、claimReservations、dispatchActive、readyQueued、draining、readiness、readinessReason、appliedConfigRevision、lastHeartbeatAt、online。在线不等于就绪。"}
        '403': {description: 无管理员权限}
  /admin/agent/skill-defaults:
    get:
      tags: [admin]
      summary: 读取管理员 Agent 默认技能配置
      responses:
        "200":
          description: 信封 data 包含 revision、items（skillId、skillName、skillVersionId、versionLabel、position、enabled、status、fileCount、totalBytes）、totalFiles、totalBytes、contextEstimateBytes；合计仅统计启用项，上下文预估为技能包整体读入的保守上限
        "401": {description: 未登录}
        "403": {description: 需要管理员权限}
    put:
      tags: [admin]
      summary: 按 revision CAS 整体替换全局默认技能
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, items]
              properties:
                revision: {type: integer, format: int64, minimum: 0}
                items:
                  type: array
                  items:
                    type: object
                    required: [skillId, skillVersionId, position, enabled]
                    properties:
                      skillId: {type: string}
                      skillVersionId: {type: string}
                      position: {type: integer}
                      enabled: {type: integer, enum: [0, 1]}
      responses:
        "200": {description: 信封 data 包含新 revision；配置仅影响新会话}
        "400": {description: 无效引用 agent_skill_defaults_invalid 或超限 agent_skill_budget_exceeded（details 包含 budget、limit、actual）}
        "401": {description: 未登录}
        "403": {description: 需要管理员权限}
        "409": {description: agent_skill_defaults_revision_conflict，details.currentRevision 为当前修订号}
  /agent/skill-defaults:
    get:
      tags: [agent]
      summary: 读取全局默认技能摘要（登录即可）
      responses:
        "200": {description: 信封 data 为 count 与按 position 排序的 skills，每项只含 skillId、skillName；仅启用项，不含正文或管理员版本详情}
        "401": {description: 未登录}
  /agent/workspaces/{canvasId}:
    parameters:
      - {in: path, name: canvasId, required: true, schema: {type: string}}
    get:
      tags: [agent]
      summary: 读取画布 Workspace（懒创建一对一记录）
      responses:
        "200": {description: 信封 data 为 WorkspaceView，含 workspaceId、canvasId、revision、agentsMd、agentsMdHash；不含技能配置}
        "401": {description: 未登录}
        "404": {description: 画布不存在或不属于当前用户}
    patch:
      tags: [agent]
      summary: 使用 revision CAS 更新当前画布文档，仅影响新运行
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision, agentsMd]
              properties:
                revision: {type: integer, format: int64, minimum: 0}
                agentsMd: {type: string, description: UTF-8 文档最多 65536 字节；空字符串用于清空}
      responses:
        "200": {description: 更新后的 WorkspaceView}
        "400": {description: 非法 JSON、缺失字段或文档超限}
        "404": {description: 画布不存在或不属于当前用户}
        "409": {description: "reason=agent_workspace_revision_conflict，details.currentRevision 为当前 revision"}
  /agent/subagent-policy:
    get:
      tags: [agent]
      summary: 读取当前用户画布的持续子代理授权
      parameters:
        - {in: query, name: canvasId, required: true, schema: {type: string}}
      responses:
        "200": {$ref: "#/components/responses/Envelope"}
        "403": {$ref: "#/components/responses/Error"}
    put:
      tags: [agent]
      summary: CAS 更新当前用户画布的持续子代理授权
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [canvasId, enabled, expectedRevision]
              properties:
                canvasId: {type: string}
                enabled: {type: boolean}
                expectedRevision: {type: integer, format: int64, minimum: 0}
      responses:
        "200": {$ref: "#/components/responses/Envelope"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /agent/runs/{id}/subagents:
    get:
      tags: [agent]
      summary: 读取父 Agent 运行创建的动态子代理
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        "200": {$ref: "#/components/responses/Envelope"}
        "404": {$ref: "#/components/responses/Error"}
  /agent/settings:
    get:
      tags: [agent]
      summary: 读取当前账户的 Agent 自定义系统提示词与 revision
      responses:
        "200": {$ref: "#/components/responses/Envelope"}
        "401": {$ref: "#/components/responses/Error"}
    patch:
      tags: [agent]
      summary: 保存账户级 Agent 系统提示词，空字符串恢复默认
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [systemPrompt, revision]
              properties:
                systemPrompt:
                  type: string
                  maxLength: 12000
                  description: 直接注入后续新建运行的系统上下文，不改变平台权限和审批规则
                revision:
                  type: integer
                  minimum: 0
                  description: 首次保存为 0，后续使用读取结果中的 revision
      responses:
        "200": {$ref: "#/components/responses/Envelope"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /agent/ui-settings:
    get:
      tags: [agent]
      summary: 读取账号默认发送方式
      responses:
        "200": { description: "data 含 defaultSendMode（interject 或 queue）与 revision" }
        "401": { $ref: "#/components/responses/Error" }
    patch:
      tags: [agent]
      summary: 按版本保存账号默认发送方式
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision, defaultSendMode]
              properties:
                revision: { type: integer, format: int64, minimum: 0 }
                defaultSendMode: { type: string, enum: [interject, queue] }
      responses:
        "200": { description: 返回保存后的设置与 revision }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /agent/conversations/{id}/messages:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, maxLength: 80 } }
    post:
      tags: [agent]
      summary: 向当前会话插话或加入持久待发队列
      description: 相同幂等身份与原请求重试返回既有收条；排队不创建运行或预留费用。expectedRunId 必须是已知最新轮，replyToQuestionId 只允许显式 interject 回答当前问题。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentConversationMessageRequest"
      responses:
        "200": { description: "data 含 delivery（queued、started、interjected 或 cancelled）、messageId、conversationId、queueRevision 和实际 runId；queued 仅表示已收下待发消息" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /agent/conversations/{id}/queue:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, maxLength: 80 } }
    get:
      tags: [agent]
      summary: 读取会话的有序待发消息与暂停状态
      responses:
        "200": { description: "data 含 conversationId、canvasId、revision、paused、pauseReason、awaitingQuestionId、questionRunId、latestRunId、items。items 按 sequence 升序，字段为 id、prompt、mode、revision、status、sequence、runId、error、createdAt、updatedAt；不返回内部请求或幂等身份" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [agent]
      summary: 按版本暂停或恢复待发队列
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision, action]
              properties:
                revision: { type: integer, format: int64, minimum: 1 }
                action: { type: string, enum: [pause, resume] }
      responses:
        "200": { description: 返回最新队列状态 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /agent/conversations/{id}/queue/{messageId}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, maxLength: 80 } }
      - { in: path, name: messageId, required: true, schema: { type: string, maxLength: 80 } }
    patch:
      tags: [agent]
      summary: 编辑未派发消息或提升为插队
      description: prompt 和 action 二选一，已领取或已派发时拒绝；提升失败保留原项。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision]
              properties:
                revision: { type: integer, format: int64, minimum: 1 }
                prompt: { type: string, maxLength: 16000 }
                action: { type: string, enum: [interject] }
      responses:
        "200": { description: 返回消息投递收条 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [agent]
      summary: 移除未派发消息并保留幂等收条
      parameters:
        - { in: query, name: revision, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        "200": { description: 返回 cancelled 消息收条 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /auth/profile:
    get:
      tags: [auth]
      summary: 当前用户个人信息及安全能力
      description: 返回 user、hasPassword、emailEnabled、linuxdoEnabled 和可选 reauthenticatedUntil；个人头像选择覆盖第三方头像。内部密码散列与头像版本字段不返回。
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /auth/profile/avatar:
    put:
      tags: [auth]
      summary: 保存当前用户头像
      description: 真实 PNG/JPEG，最大 5 MiB、1600 万像素，居中裁剪并缩小到最大512像素PNG。响应 data.user 包含更新后的头像地址。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
    delete:
      tags: [auth]
      summary: 使用系统默认头像
      description: 清除本用户头像并保存 default 选择，后续第三方登录仍使用系统头像。返回 data.user。
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /auth/profile/avatar/default:
    post:
      tags: [auth]
      summary: 选择系统头像
      description: 保存选择并原子清除自定义图片，返回 data.user。系统头像由共享组件渲染；不接受客户端 URL 或任意图标标识。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preset]
              properties:
                preset:
                  type: string
                  enum: [person, director, camera, cat, rabbit, robot, rocket, sparkles]
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /auth/profile/avatar/{userId}:
    get:
      tags: [auth]
      summary: 读取当前账号头像 PNG
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
        - name: v
          in: query
          schema: { type: string }
      responses:
        "200":
          description: 仅当前用户可读，private no-store
          content:
            image/png:
              schema: { type: string, format: binary }
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /auth/profile/password:
    post:
      tags: [auth]
      summary: 修改或设置本地密码并撤销所有会话
      description: 已有密码必须校验 currentPassword；纯第三方账号须在当前会话完成5分钟内的Linux.do重新授权核验。成功返回 data.changed=true 并清除会话 Cookie。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword:
                  type: string
                  format: password
                  minLength: 8
                  maxLength: 72
                  description: 至少8个Unicode字符，UTF-8字节长度不超过72
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /auth/profile/email-code:
    post:
      tags: [auth]
      summary: 向新邮箱发送专用验证码
      description: 验证当前密码或当前会话最近的Linux.do核验；新地址未被占用且不同于旧地址。返回 ticket、expiresIn=600、retryAfter=60；票据绑定用户/会话/凭据，仅profile_email用途有效。发送失败显式报错。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                currentPassword: { type: string, format: password }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /auth/profile/email:
    post:
      tags: [auth]
      summary: 验证新邮箱并更新绑定
      description: 原子校验邮箱唯一性、消费验证码、更新已验证邮箱并撤销全部会话；清除Cookie。返回changed=true及notificationStatus(sent/failed/not_needed)，failed仅表示已更新后的原邮箱通知失败。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket, emailCode]
              properties:
                ticket: { type: string }
                emailCode: { type: string, pattern: "^[0-9]{6}$" }
                currentPassword: { type: string, format: password }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /auth/profile/linuxdo/start:
    get:
      tags: [auth]
      summary: 发起当前账号Linux.do身份重新核验
      description: OAuth state绑定当前账号和当前会话，回调只接受原绑定subject；不创建账号或新登录会话。授权成功返回/settings?section=profile&reauth=success，失败返回reauth=error。
      responses:
        "302":
          description: 跳转到第三方授权页面
          headers:
            Location:
              schema: { type: string, format: uri }
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /referral:
    get:
      tags: [referral]
      summary: 推广中心概览（推广码、返佣比例与累计收益）
      description: 推广中心关闭、账号停用或指定推广人模式下非推广人返回 403。首次访问时生成推广码。
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "403":
          $ref: "#/components/responses/Error"
  /referral/invitees:
    get:
      tags: [referral]
      summary: 我邀请的用户（名称脱敏）
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "403":
          $ref: "#/components/responses/Error"
  /referral/commissions:
    get:
      tags: [referral]
      summary: 我的返佣记录
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "403":
          $ref: "#/components/responses/Error"
  /admin/settings/referral:
    get:
      tags: [admin]
      summary: 读取推广中心设置
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "403":
          $ref: "#/components/responses/Error"
    patch:
      tags: [admin]
      summary: 更新推广中心设置
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, mode, commissionRateBasisPoints]
              properties:
                enabled: { type: boolean }
                mode: { type: string, enum: [all, assigned] }
                commissionRateBasisPoints: { type: integer, minimum: 0, maximum: 5000, description: 万分比，1000 表示 10% }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
  /admin/referral/commissions:
    get:
      tags: [admin]
      summary: 全站推广返佣记录
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "403":
          $ref: "#/components/responses/Error"
  /auth/session:
    get:
      tags: [auth]
      summary: 当前登录会话
      description: 登录时 data 包含 user、runtimeLimits、drawingEngine、features 和 referralAvailable（是否显示推广中心入口）。
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
  /auth/login:
    post:
      tags: [auth]
      security: []
      summary: 登录并设置会话 Cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
  /projects:
    get:
      tags: [projects]
      summary: 短剧项目列表
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      tags: [projects]
      summary: 创建短剧项目
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
  /resources:
    get:
      tags: [resources]
      summary: 当前用户资源列表
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
    post:
      tags: [resources]
      summary: 上传资源文件
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "403":
          description: 配额用尽（code=40301, reason=quota_exceeded 或 storage_capacity_exceeded）；账号只读（code=40302, reason=storage_read_only）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /resources/access:
    post:
      tags: [resources]
      summary: 批量签发当前用户资源访问描述
      description: 统一处理展示、下载、复制、浏览器字节处理和模型输入；客户端不能通过查询参数选择 direct/proxy。每项独立成功或失败。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 100
              items:
                type: object
                required: [resourceId]
                properties:
                  resourceId: {type: string}
                  purpose: {type: string, enum: [display, copy, download, browser-process, provider-input], default: display}
                  variant: {type: string, enum: [original, playback], default: original}
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /resources/{id}/file:
    get:
      tags: [resources]
      summary: 读取资源二进制（非 JSON 信封）
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: access
          schema: { type: string, enum: ["1"] }
          description: 仅返回统一访问描述，不返回文件正文。
        - in: query
          name: variant
          schema: { type: string, enum: [original, playback], default: original }
        - in: query
          name: purpose
          schema: { type: string, enum: [display, download, browser-process], default: display }
      responses:
        "200":
          description: 文件流
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /workbench/tools:
    get:
      tags: [workbench]
      summary: 获取当前用户可用的工作台工具
      parameters:
        - in: query
          name: kind
          required: true
          schema: { type: string, enum: [image, video] }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /workbench/tasks:
    get:
      tags: [workbench]
      summary: 查询当前用户的工作台任务
      parameters:
        - in: query
          name: kind
          required: true
          schema: { type: string, enum: [image, video] }
        - in: query
          name: activeOnly
          schema: { type: boolean, default: false }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      tags: [workbench]
      summary: 创建工作台生成任务
      description: 仅接受模型选择意图、资源 ID、提示词和允许的生成参数；toolId 可选，服务端校验开关、所选工具、资源、模型能力和账单，不接受客户端 providerConfig、密钥或上游 URL。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, prompt, model, modelChoice, parameters, references]
              properties:
                kind: { type: string, enum: [image, video] }
                toolId: { type: string }
                presetId: { type: string }
                prompt: { type: string, minLength: 1, maxLength: 32000 }
                model: { type: string }
                logicalModelId: { type: string }
                modelChoice:
                  type: object
                  additionalProperties: false
                  properties:
                    logicalModelId: { type: string }
                    modelName: { type: string }
                workbench:
                  type: object
                  additionalProperties: false
                  properties:
                    kind: { type: string, enum: [image, video] }
                    toolId: { type: string }
                    presetId: { type: string }
                parameters:
                  type: object
                  additionalProperties: false
                  properties:
                    size: { type: string }
                    quality: { type: string }
                    count: { type: integer, minimum: 1 }
                    videoSeconds: { type: integer, minimum: 1 }
                    ratio: { type: string }
                    resolution: { type: string }
                    generateAudio: { type: boolean }
                    watermark: { type: boolean }
                references:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    additionalProperties: false
                    required: [resourceId, kind, role]
                    properties:
                      resourceId: { type: string }
                      kind: { type: string, enum: [image, video, audio] }
                      role: { type: string, enum: [reference, first_frame, last_frame] }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /admin/workbench/tools:
    get:
      tags: [workbench, admin]
      summary: 管理工作台工具目录
      parameters:
        - in: query
          name: kind
          schema: { type: string, enum: [image, video] }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "403":
          $ref: "#/components/responses/Error"
  /tasks:
    post:
      tags: [tasks]
      summary: 创建生成任务
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
  /tasks/{id}/recover-media:
    post:
      tags: [tasks]
      summary: 按原任务 ID 重试作品保存，不重新生成或创建计费订单
      description: 仅当前用户有恢复记录的保存失败任务可重入队；已在队列或运行中时幂等返回。每任务最多手动恢复三次，间隔至少一分钟。已取消、已退款或归属项目不可用时拒绝。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /tasks/{id}/text-events:
    get:
      tags: [tasks]
      summary: 文本任务 SSE
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: after
          schema: { type: integer }
          description: 递增事件游标，不要用任务 ID
      responses:
        "200":
          description: text/event-stream
  /assets:
    get:
      tags: [assets]
      summary: 用户素材库
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
  /assets/batch-delete:
    post:
      tags: [assets]
      summary: 批量彻底删除当前用户素材
      description: 顶层 JSON 数组，一次请求、一个数据库事务。所有 ID 必须属于当前用户，不受任务、画布或历史引用阻塞；共享文件保留，其余通过 Outbox 异步清理，失败重试。任一素材不存在、越权或数据库写入失败时整批不删除。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 1000
              items:
                type: string
                minLength: 1
            example: ["asset-1", "asset-2"]
      responses:
        "200":
          description: 成功信封，data.ids 返回本次请求的素材 ID 数组；物理文件清理由后台执行。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [ids]
                        properties:
                          ids:
                            type: array
                            items: { type: string }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /assets/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    delete:
      tags: [assets]
      summary: 彻底删除当前用户素材
      description: 不依赖素材 archived 状态，也不受画布、任务、项目或历史快照引用阻塞；其他素材共享的物理对象仍保留。
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
components:
  parameters:
    AgentRunID:
      name: id
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: open_ai_canvas_session
  schemas:
    FeedbackAttachment:
      type: object
      required: [id, name, type, url, size, mimeType]
      properties:
        id: {type: string}
        name: {type: string}
        type: {type: string, enum: [image, video]}
        url: {type: string}
        size: {type: integer, format: int64, minimum: 0}
        mimeType: {type: string}
    UserFeedback:
      type: object
      required: [id, userId, userName, userEmail, contact, type, title, content, attachments, environment, status, adminReply, archived, createdAt, updatedAt]
      properties:
        id: {type: string}
        userId: {type: string}
        userName: {type: string}
        userEmail: {type: string}
        contact: {type: string}
        type: {type: string, enum: [bug, feature, improvement, other]}
        title: {type: string, description: 最多 200 个 UTF-8 字节}
        content: {type: string, description: 最多 10000 个 UTF-8 字节}
        attachments: {type: string, description: JSON-encoded array of FeedbackAttachment}
        environment: {type: string, description: JSON-encoded client environment object}
        status: {type: string, enum: [pending, processing, resolved, closed, archived]}
        adminReply: {type: string}
        repliedAt: {type: string, format: date-time, nullable: true}
        archived: {type: boolean}
        archivedAt: {type: string, format: date-time, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    FeedbackSubmission:
      type: object
      required: [title, content]
      properties:
        type: {type: string, enum: [bug, feature, improvement, other]}
        title: {type: string, minLength: 1, description: 最多 200 个 UTF-8 字节}
        content: {type: string, minLength: 1, description: 最多 10000 个 UTF-8 字节}
        contact: {type: string}
        attachments: {type: string, description: JSON-encoded array of FeedbackAttachment}
        environment: {type: string, description: JSON-encoded client environment object}
    FeedbackAdminUpdate:
      type: object
      properties:
        status: {type: string, enum: [pending, processing, resolved, closed]}
        adminReply: {type: string}
        archived: {type: boolean}
    FeedbackListResult:
      type: object
      required: [list, total, page, limit]
      properties:
        list: {type: array, items: {$ref: "#/components/schemas/UserFeedback"}}
        total: {type: integer, format: int64}
        page: {type: integer, minimum: 1}
        limit: {type: integer, minimum: 1, maximum: 100}

    LoginLog:
      type: object
      properties:
        id: {type: string}
        userId: {type: string, nullable: true}
        username: {type: string, description: 事件时用户名快照}
        displayName: {type: string}
        account: {type: string, description: 用户名或脱敏的尝试账号}
        event: {type: string, enum: [login, logout]}
        method: {type: string, enum: [password, email, sms, linuxdo, verification, unknown]}
        source: {type: string, enum: [login, registration, logout]}
        result: {type: string, enum: [success, failed]}
        ip: {type: string}
        userAgent: {type: string, maxLength: 512, description: 客户端自报信息，不作为身份判断依据}
        sessionRef: {type: string, description: 会话 ID 的单向哈希，仅关联历史事件，不含 Token}
        reason: {type: string}
        message: {type: string}
        createdAt: {type: string, format: date-time}
    ToolMutation:
      type: object
      required: [type, label, prompt]
      properties:
        type: {type: string, enum: [style, motion, nine_grid, effect]}
        label: {type: string, description: 名称最多 120 字节}
        prompt: {type: string, description: 最多 8000 字节，不允许嵌套工具标签}
        visibility: {type: string, enum: [private, public], default: private}
        desc: {type: string}
        tag: {type: string}
        cover: {type: string, description: 本人已上传完成的资源 URL，仅限私有工具}
        mediaUrl: {type: string, description: 本人已上传完成的资源 URL，仅限私有工具}
        extraInfo: {type: array, items: {type: string}}
        ratio: {type: string}
    ModelRequestIntent:
      type: object
      required: [capability]
      properties:
        capability:
          type: string
          enum: [text, image, video, audio]
        operation:
          type: string
          description: 可选生成操作，必须符合所选模型的能力合同
        inputs:
          type: object
          description: 按素材类型统计的参考数量，如 image、video、audio；另受所选模型的数量上限约束
          additionalProperties:
            type: integer
            minimum: 0
            maximum: 128
        options:
          type: object
          description: 当前创作规格；未指定的参数使用服务端默认值
          additionalProperties: true
          example:
            vquality: 720p
            size: "16:9"
            videoSeconds: 5
            videoGenerateAudio: true
    LogicalModelQuote:
      type: object
      required: [logicalModelId, billingMode, quantity, amountMicrocredits, estimated]
      properties:
        logicalModelId:
          type: string
          description: 前台逻辑模型 ID；直接查询系统渠道模型时为空字符串
        billingMode:
          type: string
          enum: [fixed_request, per_second, token]
        quantity:
          type: integer
          format: int64
          minimum: 1
          description: 按次为 1，按秒为生成秒数，按 Token 为预留用量（视频含平台预留余量）
        amountMicrocredits:
          type: integer
          format: int64
          minimum: 0
          description: 预估预留微积分，1000000 微积分等于 1 积分；明确配置的免费价格返回 0
        estimated:
          type: boolean
          description: Token 计费为 true；优先有效上游 usage，视频无有效用量时按提交的公式快照结算，预留不构成费用上限
        videoTokenEstimate:
          $ref: "#/components/schemas/VideoTokenEstimate"
    VideoTokenEstimate:
      type: object
      description: 仅视频 Token 报价返回；将火山公式用量和平台预留余量分开披露
      required: [formulaTokens, reservedTokens, outputWidth, outputHeight, framesPerSecond, outputSeconds, referenceSeconds, referenceDurationEstimated, dimensionsEstimated, reservationMarginPercent]
      properties:
        formulaTokens:
          type: integer
          format: int64
          minimum: 1
          description: 按（参考视频总秒数 + 输出秒数）× 输出宽 × 输出高 × 帧率 / 1024 向上取整；上游最低计费用量可能更高
        reservedTokens:
          type: integer
          format: int64
          minimum: 1
          description: 公式用量叠加平台预留余量后向上取整
        outputWidth:
          type: integer
          format: int64
          minimum: 1
        outputHeight:
          type: integer
          format: int64
          minimum: 1
        framesPerSecond:
          type: integer
          format: int64
          minimum: 1
        outputSeconds:
          type: integer
          format: int64
          minimum: 1
        referenceSeconds:
          type: number
          format: double
          minimum: 0
          description: 计入公式的参考视频总秒数；报价仅有参考数量时采用预估时长
        referenceDurationEstimated:
          type: boolean
          description: 参考时长未知、使用预估值时为 true
        dimensionsEstimated:
          type: boolean
          description: 自适应画幅或上游型号无法确定，使用预估像素尺寸时为 true
        reservationMarginPercent:
          type: integer
          format: int64
          minimum: 0
          description: 平台预留余量百分比，不属于火山官方计费公式
    ModelQuoteEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [data]
          properties:
            code:
              type: integer
              enum: [0]
            data:
              type: object
              required: [quote]
              properties:
                quote:
                  $ref: "#/components/schemas/LogicalModelQuote"
    CloudAgentRequest:
      type: object
      additionalProperties: false
      required: [canvasId, prompt, permissionMode, contextScope, budget, idempotencyKey]
      properties:
        canvasId:
          type: string
          maxLength: 80
        prompt:
          type: string
          description: 非空，最多 16000 字节
        logicalModelId:
          type: string
        model:
          type: string
        channelId:
          type: string
        channelModelKey:
          type: string
        permissionMode:
          type: string
          enum: [read_only, request_approval, auto]
        reasoningMode:
          type: string
          enum: [off, auto, deep]
          description: 本轮推理策略；供应商是否支持由后端校验
        skillIds:
          type: array
          maxItems: 16
          items:
            type: string
          description: 用户为对话固定或在本条消息里点名的技能；其余已安装且 agentMode=auto 的技能由 Agent 按技能目录自动发现
        contextScope:
          type: array
          maxItems: 1
          items:
            type: string
            enum: [canvas]
        budget:
          type: object
          additionalProperties: false
          required: [maxCredits]
          properties:
            maxCredits:
              type: number
              minimum: 0
              exclusiveMinimum: true
              maximum: 1000000
            maxGenerationTasks:
              type: integer
              minimum: 0
              maximum: 8
            maxVideoSeconds:
              type: integer
              minimum: 0
              maximum: 120
            maxSteps:
              type: integer
              minimum: 0
              maximum: 9999
              description: 0 表示本次请求不另设上限；仍受后台执行策略限制
        idempotencyKey:
          type: string
          minLength: 8
          maxLength: 128
    Envelope:
      type: object
      required: [code, msg]
      properties:
        code:
          type: integer
          description: 0 成功；失败时默认等于 HTTP 状态，或 status*100+n 的细分码
        data: {}
        msg:
          type: string
        reason:
          type: string
          description: 仅失败时出现。稳定机器可读原因。
    ErrorEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            code:
              type: integer
              enum: [400, 401, 403, 404, 409, 429, 500, 502, 503, 504, 40301, 40302, 40901, 42901]
            data:
              nullable: true
            reason:
              type: string
              enum:
                - invalid_argument
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - project_name_conflict
                - skill_version_conflict
                - failed_precondition
                - quota_exceeded
                - storage_capacity_exceeded
                - storage_read_only
                - rate_limited
                - unavailable
                - timeout
                - internal
                - bad_gateway
                - upstream_dns_failed
                - model_capability_not_supported
                - model_price_not_configured
                - model_route_unavailable
                - provider_request_failed
                - model_catalog_mismatch
                - invalid_model_selection
    AgentConversationMessageRequest:
      type: object
      additionalProperties: false
      required: [mode, expectedRunId, request]
      properties:
        mode: { type: string, enum: [interject, queue] }
        expectedRunId: { type: string, maxLength: 80 }
        replyToQuestionId: { type: string, maxLength: 160 }
        request:
          $ref: "#/components/schemas/CloudAgentRequest"
  responses:
    ModelQuote:
      description: 当前参数对应的费用报价，位于信封 data.quote
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ModelQuoteEnvelope"
    Envelope:
      description: 业务成功信封
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    Error:
      description: 业务失败信封
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
