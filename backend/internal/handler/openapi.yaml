    get:
      tags: [assets]
      summary: 用户素材库
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
  /assets/batch-delete:
    post:
      tags: [assets]
      summary: 批量彻底删除当前用户素材
      description: 顶层 JSON 数组，一次请求、一个数据库事务。所有 ID 必须属于当前用户，不受任务、画布或历史引用阻塞；共享文件保留，其余通过 Outbox 异步清理，失败重试。任一素材不存在、越权或数据库写入失败时整批不删除。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 1000
              items:
                type: string
                minLength: 1
            example: ["asset-1", "asset-2"]
      responses:
        "200":
          description: 成功信封，data.ids 返回本次请求的素材 ID 数组；物理文件清理由后台执行。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [ids]
                        properties:
                          ids:
                            type: array
                            items: { type: string }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /assets/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    put:
      tags: [assets]
      summary: 保存当前用户素材，支持条件创建
      description: If-None-Match 为 * 时在账号锁事务内仅创建不存在的全局素材 ID；已存在返回 412 且不改任何字段。遗漏此头维持原 upsert 行为。
      parameters:
        - in: header
          name: If-None-Match
          required: false
          schema: {type: string, enum: ["*"]}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asset]
              properties:
                asset: {type: object}
      responses:
        "200": {$ref: "#/components/responses/Envelope"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "412":
          description: 全局素材 ID 已存在；reason 为 asset_already_exists，无副作用且不暴露已有实体
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    delete:
      tags: [assets]
      summary: 彻底删除当前用户素材
      description: 不依赖素材 archived 状态，也不受画布、任务、项目或历史快照引用阻塞；其他素材共享的物理对象仍保留。
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
components:
  parameters:
    CanvasEditProofs:
      in: header
      name: X-Canvas-Edit-Proofs
      description: 临时证明 JSON 数组，每项为 canvasId/nodeId/sessionId/token；最多 128 项、32 KiB，禁止在 URL 或持久 operation identity 中携带
      schema: {type: string, maxLength: 32768}
    AgentRunID:
      name: id
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: open_ai_canvas_session
  schemas:
    CanvasEditLeaseRequest:
      type: object
      required: [nodeId, sessionId, token]
      additionalProperties: false
      properties:
        canvasId: {type: string, maxLength: 128, description: 可省略；提供时必须与路径一致}
        nodeId: {type: string, minLength: 1, maxLength: 128}
        sessionId: {type: string, minLength: 1, maxLength: 128}
        token: {type: string, minLength: 32, maxLength: 128, description: 客户端用安全随机源生成的可打印 ASCII；首次请求前生成以便丢 ACK 后重试}
    CanvasSyncStatus:
      type: object
      required: [revision, documentEpoch, eventSeq, leases, activeAgents]
      properties:
        revision: {type: integer, format: int64}
        documentEpoch: {type: string}
        eventSeq: {type: integer, format: int64}
        leases:
          type: array
          items:
            type: object
            required: [canvasId, nodeId, sessionId, expiresAt]
            properties:
              canvasId: {type: string}
              nodeId: {type: string}
              sessionId: {type: string}
              expiresAt: {type: string, format: date-time}
        activeAgents:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              conversationId: {type: string}
              title: {type: string}
              status: {type: string}
              updatedAt: {type: string, format: date-time}
    DiagnosticExportRequest:
      type: object
      properties:
        from: {type: string, format: date-time, description: 默认最近 30 分钟，最长 24 小时}
        to: {type: string, format: date-time}
        taskId: {type: string, maxLength: 96}
        projectId: {type: string, maxLength: 96, description: 沿用任务的历史画布分组标识}
        canvasId: {type: string, maxLength: 96, description: 当前用户所属画布，与任务上下文必须一致}
        description: {type: string, maxLength: 1000}
        runtime:
          type: object
          properties:
            appVersion: {type: string}
            buildCommit: {type: string}
            browser: {type: string}
            os: {type: string}
            timezone: {type: string}
        clientEvents:
          type: array
          description: 保留最近 500 条，字段与浏览器诊断事件一致
          items: {type: object}
    DiagnosticPreview:
      type: object
      properties:
        clientEventLimit: {type: integer}
        taskCount: {type: integer}
        taskLogCount: {type: integer}
        apiCallCount: {type: integer}
        canvasCount: {type: integer}
        canvasChangeCount: {type: integer}
        agentRunCount: {type: integer}
        agentMessageCount: {type: integer}
        agentEventCount: {type: integer}
        estimatedBytes: {type: integer, format: int64, description: 未压缩脱敏内容估算}
        willTruncate: {type: boolean}
    ToolMutation:
      type: object
      required: [type, label, prompt]
      properties:
        type: {type: string, enum: [style, motion, nine_grid, effect]}
        label: {type: string, description: 名称最多 120 字节}
        prompt: {type: string, description: 最多 8000 字节，不允许嵌套工具标签}
        visibility: {type: string, enum: [private, public], default: private}
        desc: {type: string}
        tag: {type: string}
        cover: {type: string, description: 本人已上传完成的资源 URL，仅限私有工具}
        mediaUrl: {type: string, description: 本人已上传完成的资源 URL，仅限私有工具}
        extraInfo: {type: array, items: {type: string}}
        ratio: {type: string}
    ModelRequestIntent:
      type: object
      required: [capability]
      properties:
        capability:
          type: string
          enum: [text, image, video, audio]
        operation:
          type: string
          description: 可选生成操作，必须符合所选模型的能力合同
        inputs:
          type: object
          description: 按素材类型统计的参考数量，如 image、video、audio；另受所选模型的数量上限约束
          additionalProperties:
            type: integer
            minimum: 0
            maximum: 128
        options:
          type: object
          description: 当前创作规格；未指定的参数使用服务端默认值
          additionalProperties: true
          example:
            vquality: 720p
            size: "16:9"
            videoSeconds: 5
            videoGenerateAudio: true
    LogicalModelQuote:
      type: object
      required: [logicalModelId, billingMode, quantity, amountMicrocredits, estimated]
      properties:
        logicalModelId:
          type: string
          description: 前台逻辑模型 ID；直接查询系统渠道模型时为空字符串
        billingMode:
          type: string
          enum: [fixed_request, per_second, token]
        quantity:
          type: integer
          format: int64
          minimum: 1
          description: 按次为 1，按秒为生成秒数，按 Token 为预留用量（视频含平台预留余量）
        amountMicrocredits:
          type: integer
          format: int64
          minimum: 0
          description: 预估预留微积分，1000000 微积分等于 1 积分；明确配置的免费价格返回 0
        estimated:
          type: boolean
          description: Token 计费为 true；优先有效上游 usage，视频无有效用量时按提交的公式快照结算，预留不构成费用上限
        videoTokenEstimate:
          $ref: "#/components/schemas/VideoTokenEstimate"
    VideoTokenEstimate:
      type: object
      description: 仅视频 Token 报价返回；将火山公式用量和平台预留余量分开披露
      required: [formulaTokens, reservedTokens, outputWidth, outputHeight, framesPerSecond, outputSeconds, referenceSeconds, referenceDurationEstimated, dimensionsEstimated, reservationMarginPercent]
      properties:
        formulaTokens:
          type: integer
          format: int64
          minimum: 1
          description: 按（参考视频总秒数 + 输出秒数）× 输出宽 × 输出高 × 帧率 / 1024 向上取整；上游最低计费用量可能更高
        reservedTokens:
          type: integer
          format: int64
          minimum: 1
          description: 公式用量叠加平台预留余量后向上取整
        outputWidth:
          type: integer
          format: int64
          minimum: 1
        outputHeight:
          type: integer
          format: int64
          minimum: 1
        framesPerSecond:
          type: integer
          format: int64
          minimum: 1
        outputSeconds:
          type: integer
          format: int64
          minimum: 1
        referenceSeconds:
          type: number
          format: double
          minimum: 0
          description: 计入公式的参考视频总秒数；报价仅有参考数量时采用预估时长
        referenceDurationEstimated:
          type: boolean
          description: 参考时长未知、使用预估值时为 true
        dimensionsEstimated:
          type: boolean
          description: 自适应画幅或上游型号无法确定，使用预估像素尺寸时为 true
        reservationMarginPercent:
          type: integer
          format: int64
          minimum: 0
          description: 平台预留余量百分比，不属于火山官方计费公式
    ModelQuoteEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [data]
          properties:
            code:
              type: integer
              enum: [0]
            data:
              type: object
              required: [quote]
              properties:
                quote:
                  $ref: "#/components/schemas/LogicalModelQuote"
    AgentConversationMessageRequest:
      type: object
      additionalProperties: false
      required: [mode, expectedRunId, request]
      properties:
        mode: { type: string, enum: [interject, queue] }
        expectedRunId: { type: string, maxLength: 80 }
        replyToQuestionId: { type: string, maxLength: 160 }
        request:
          $ref: "#/components/schemas/CloudAgentRequest"
    CloudAgentRequest:
      type: object
      additionalProperties: false
      required: [canvasId, prompt, permissionMode, contextScope, budget, idempotencyKey]
      properties:
        canvasId:
          type: string
          maxLength: 80
        prompt:
          type: string
          description: 非空，最多 16000 字节
        logicalModelId:
          type: string
        model:
          type: string
        channelId:
          type: string
        channelModelKey:
          type: string
        permissionMode:
          type: string
          enum: [read_only, request_approval, auto]
        reasoningMode:
          type: string
          enum: [off, auto, deep]
          description: 本轮推理策略；供应商是否支持由后端校验
        skillIds:
          type: array
          maxItems: 8
          items:
            type: string
        contextScope:
          type: array
          maxItems: 1
          items:
            type: string
            enum: [canvas]
        budget:
          type: object
          additionalProperties: false
          required: [maxCredits]
          properties:
            maxCredits:
              type: number
              minimum: 0
              exclusiveMinimum: true
              maximum: 1000000
            maxGenerationTasks:
              type: integer
              minimum: 0
              maximum: 8
            maxVideoSeconds:
              type: integer
              minimum: 0
              maximum: 120
            maxSteps:
              type: integer
              minimum: 0
              maximum: 9999
              description: 0 表示本次请求不另设上限；仍受后台执行策略限制
        idempotencyKey:
          type: string
          minLength: 8
          maxLength: 128
    ProjectAssetSyncState:
      type: object
      required: [projectRevision, asset]
      properties:
        projectRevision: {type: integer, format: int64, minimum: 0}
        asset:
          type: object
          nullable: true
          required: [id, title, mediaType, category, status, versionCount, usages, position, updatedAt]
          properties:
            id: {type: string}
            title: {type: string}
            mediaType: {type: string}
            category: {type: string, enum: [character, environment, prop, material, other]}
            status: {type: string}
            primaryVersionId: {type: string}
            versionCount: {type: integer}
            usages: {type: array, items: {type: string}}
            folderId: {type: string}
            position: {type: integer}
            storageKey: {type: string}
            durationMs: {type: integer, format: int64}
            previewText: {type: string}
            updatedAt: {type: string, format: date-time}
            source: {type: string}
            character: {type: object}
    Envelope:
      type: object
      required: [code, msg]
      properties:
        code:
          type: integer
          description: 0 成功；失败时默认等于 HTTP 状态，或 status*100+n 的细分码
        data: {}
        msg:
          type: string
        reason:
          type: string
          description: 仅失败时出现。稳定机器可读原因。
    ErrorEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            code:
              type: integer
              enum: [400, 401, 403, 404, 409, 412, 429, 500, 502, 503, 504, 40301, 40901, 42901]
            data:
              nullable: true
            reason:
              type: string
              enum:
                - invalid_argument
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - project_asset_sync_conflict
                - asset_already_exists
                - failed_precondition
                - quota_exceeded
                - rate_limited
                - unavailable
                - timeout
                - internal
                - bad_gateway
                - upstream_dns_failed
                - model_capability_not_supported
                - model_price_not_configured
                - model_route_unavailable
                - provider_request_failed
                - model_catalog_mismatch
                - invalid_model_selection
  responses:
    ModelQuote:
      description: 当前参数对应的费用报价，位于信封 data.quote
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ModelQuoteEnvelope"
    Envelope:
      description: 业务成功信封
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    Error:
      description: 业务失败信封
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
