          schema: { type: string }
        - in: query
          name: kind
          schema: { type: string, enum: [cast, video, final] }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /dramas/{id}/canvas-assets:
