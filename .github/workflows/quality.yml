name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main
      # dev 是日常集成分支：这里没有它时，直接推到 dev 的改动完全不会被 CI 覆盖。
      - dev

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # 后端有 5 个用例默认会静默跳过：3 个需要 CANVAS_TEST_POSTGRES_DSN，2 个用
    # exec.LookPath("redis-server") 自起临时实例。只跑 go test ./... 而不备齐这两样，
    # PostgreSQL 迁移 / 素材字节修复 / Redis 租约与缓存白名单这些路径就永远不会被执行。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: canvas_test
          POSTGRES_DB: canvas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CANVAS_TEST_POSTGRES_DSN: postgres://postgres:canvas_test@127.0.0.1:5432/canvas_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
      - name: Install redis-server for integration tests
        # 用例自己拉起临时 redis-server（unix socket），所以需要的是可执行文件而不是 redis 服务。
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq redis-server
          sudo systemctl stop redis-server || true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Run Go tests
        run: go test ./...
      - name: Ensure dependency-backed tests were not skipped
        run: |
          go test ./internal/database/ ./internal/canvas/ ./internal/repository/ ./internal/platform/ ./internal/app/ \
            -run 'TestPostgresAssetIDMigration|TestRepairAssetBytesPostgres|TestCanvasRevision|TestRuntimeCoordinatorRedisLeasePreservesLongestTTL|TestClearAdminRuntimeCacheUsesRedisWhitelist' \
            -count=1 -v | tee /tmp/dependency-tests.log
          if grep -q -- "--- SKIP" /tmp/dependency-tests.log; then
            echo "::error::依赖外部服务的用例被跳过：请检查 CANVAS_TEST_POSTGRES_DSN 与 redis-server"
            exit 1
          fi

  payment-plugins:
    name: Payment plugin artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical payment packages
        env:
          PAYMENT_PLUGIN_SMOKE_TEST: "1"
        run: sh plugin-packages/verify-payment-packages.sh --all linux amd64
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and execute payment packages for every image platform
        run: >-
          docker buildx build
          --platform linux/amd64,linux/arm64
          --target payment-package-smoke
          --file backend/Dockerfile
          .

  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Reject leftover package manager lockfiles
        working-directory: ${{ github.workspace }}
        run: |
          leftover=0
          for file in web/pnpm-lock.yaml web/package-lock.json web/yarn.lock; do
            if [ -f "$file" ]; then
              echo "forbidden lockfile: $file"
              leftover=1
            fi
          done
          if [ "$leftover" -ne 0 ]; then
            echo "web installs from bun.lock only"
            exit 1
          fi
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          changed_files=()
          repo_prefix="$(git rev-parse --show-prefix)"
          while IFS= read -r -d '' file; do
            case "$file" in
              *.css|*.html|*.json|*.js|*.jsx|*.md|*.mdx|*.mjs|*.cjs|*.ts|*.tsx|*.yaml|*.yml)
                base_path="${repo_prefix}${file}"
                if git cat-file -e "$BASE_SHA:$base_path" 2>/dev/null \
                  && ! diff -q \
                    <(git show "$BASE_SHA:$base_path") \
                    <(git show "$BASE_SHA:$base_path" | bunx prettier --ignore-path /dev/null --stdin-filepath "$file") \
                    >/dev/null; then
                  echo "Skipping legacy unformatted file: $file"
                  continue
                fi
                changed_files+=("$file")
                ;;
            esac
          done < <(git diff --relative --name-only --diff-filter=ACMR -z "$BASE_SHA" "$GITHUB_SHA" -- .)
          if (( ${#changed_files[@]} > 0 )); then
            bunx prettier --check "${changed_files[@]}"
          else
            echo "No changed web files require formatting checks."
          fi
      - name: Typecheck
        run: bun run typecheck
      - name: Lint retired Ant Design APIs
        run: bun run lint
      - name: Run tests
        run: bun run test
      # ubuntu-latest 预装 google-chrome；脚本的解析顺序已覆盖该路径，
      # 因此不引入第三方 setup action，也不需要任何 secret。
      - name: Director P0 Chrome E2E
        run: |
          google-chrome --version || chromium --version
          bun run test:director:e2e
