name: Quality checks

on:
  pull_request:
  workflow_call:
  # 允许手动触发：GitHub 偶发漏发 pull_request 事件时（实测出现过一次），
  # 可以直接对某个分支派一次完整检查，而不必推一个空提交。
  workflow_dispatch:
  push:
    branches:
      - main
      # canary 是前瞻开发分支：推送同样跑完整质量检查（镜像发布仍仅限 main/tag）。
      - canary
      # dev 是日常集成分支：这里没有它时，直接推到 dev 的改动完全不会被 CI 覆盖。
      - dev

permissions:
  contents: read

jobs:
  agent:
    name: Agent checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build and test
        run: npm test

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # CI强制9条依赖验收：4条画布PostgreSQL、1条Agent配额PostgreSQL、
    # 2条自起临时Redis（租约、缓存白名单）及2条真实TCP Redis跨实例协作恢复。
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: canvas_test
          POSTGRES_DB: canvas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CANVAS_TEST_REDIS_ADDR: 127.0.0.1:6379
      CANVAS_TEST_POSTGRES_DSN: postgres://postgres:canvas_test@127.0.0.1:5432/canvas_test?sslmode=disable
      TEST_AGENT_POSTGRES_DSN: postgres://postgres:canvas_test@127.0.0.1:5432/canvas_event_integration?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
          cache: true
      - name: Prepare isolated Agent admission database
        run: docker exec "${{ job.services.postgres.id }}" psql -U postgres -d postgres -c 'CREATE DATABASE canvas_event_integration'
      - name: Install redis-server for integration tests
        # 用例自己拉起临时 redis-server（unix socket），所以需要的是可执行文件而不是 redis 服务。
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq redis-server
          sudo systemctl stop redis-server || true
      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - name: Vet Go packages
        run: go vet ./...
      - name: Install pinned incremental analyzers
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          go install github.com/gordonklaus/ineffassign@v0.2.0
      - name: Check architecture slice and analyzer fixtures
        shell: bash
        run: |
          "$(go env GOPATH)/bin/staticcheck" ./internal/architecture
          "$(go env GOPATH)/bin/ineffassign" ./internal/architecture
          if "$(go env GOPATH)/bin/staticcheck" ./internal/architecture/testdata/lintbad; then
            echo "staticcheck did not reject its fixture"
            exit 1
          fi
          if "$(go env GOPATH)/bin/ineffassign" ./internal/architecture/testdata/lintbad; then
            echo "ineffassign did not reject its fixture"
            exit 1
          fi
      - name: Run Go tests
        shell: bash
        run: |
          set -o pipefail
          # internal/app 的用例数已接近 Go 默认的每包 10 分钟上限（实测 CI 上约 9 分钟），
          # 加几个用例就会整包超时失败。这里把上限抬到 20 分钟：它只是超时保护，
          # 不影响用例本身的行为与结果。
          go test -timeout 20m -json ./... | tee "$RUNNER_TEMP/go-tests.jsonl"
      - name: Ensure dependency-backed tests were not skipped
        shell: bash
        run: |
          python3 ../.github/scripts/test_check_dependency_tests.py
          python3 ../.github/scripts/check-dependency-tests.py "$RUNNER_TEMP/go-tests.jsonl"
      - name: Upload Go test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-test-timings
          path: ${{ runner.temp }}/go-tests.jsonl
          if-no-files-found: ignore
  payment-plugins:
    name: Payment plugin artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical payment packages
        env:
          PAYMENT_PLUGIN_SMOKE_TEST: "1"
        run: sh plugin-packages/verify-payment-packages.sh --all linux amd64
      # 发布时 backend/Dockerfile 会在两种架构的原生 Runner 上执行 smoke。
      # PR 仍独立验证双架构，不能因没有发布任务而遗漏 ARM64 验收。
      - uses: docker/setup-qemu-action@v3
        if: github.event_name == 'pull_request'
      - uses: docker/setup-buildx-action@v3
        if: github.event_name == 'pull_request'
      - name: Build and execute payment packages for every image platform
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          target: payment-package-smoke
          file: backend/Dockerfile
          cache-from: type=gha,scope=payment-smoke
          cache-to: type=gha,mode=max,scope=payment-smoke

  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Reject leftover package manager lockfiles
        working-directory: ${{ github.workspace }}
        run: |
          leftover=0
          for file in web/pnpm-lock.yaml web/package-lock.json web/yarn.lock; do
            if [ -f "$file" ]; then
              echo "forbidden lockfile: $file"
              leftover=1
            fi
          done
          if [ "$leftover" -ne 0 ]; then
            echo "web installs from bun.lock only"
            exit 1
          fi
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # web 测试会直接引用 director-desk 源码（three 等依赖来自它自己的 lockfile）。
      - name: Install director-desk dependencies
        working-directory: ${{ github.workspace }}/director-desk
        run: npm ci --ignore-scripts
      - name: Check formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun scripts/check-changed-formatting.mjs
      - name: Typecheck
        run: bun run typecheck
      - name: Lint retired Ant Design APIs
        run: bun run lint
      - name: Run tests
        run: bun run test
      # ubuntu-latest 预装 google-chrome；脚本的解析顺序已覆盖该路径，
      # 因此不引入第三方 setup action，也不需要任何 secret。
      - name: Director P0 Chrome E2E
        run: |
          google-chrome --version || chromium --version
          bun run test:previs:e2e

  canvas-node-acceptance:
    name: Canvas node acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
          cache: true
      - name: Install locked web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Verify host and editor capability agreement
        working-directory: backend
        run: go test ./internal/canvas/commands -run '^TestEditorCapabilitiesFixture$' -count=1
      - name: Exercise every node and feature producer
        working-directory: web
        run: bun scripts/audit-canvas-node-save.tsx test/fixtures/canvas-editor-capabilities.json "$RUNNER_TEMP/node-functions.json"
      - name: Persist producer operations and verify fresh reads and replay
        working-directory: backend
        env:
          CANVAS_NODE_ACCEPTANCE_FILE: ${{ runner.temp }}/node-functions.json
          CGO_ENABLED: "1"
        run: go test -v ./internal/canvas/commands -run '^TestNodeFunctionAcceptance$' -count=1 -timeout=5m
      - name: Upload node acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canvas-node-acceptance
          path: ${{ runner.temp }}/node-functions.json
          if-no-files-found: error
          retention-days: 7

  changelog:
    name: Changelog entry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      # publish-images.yml 打 tag 时要求 CHANGELOG.md 里存在 `## <VERSION>`，并把它下面
      # 的内容直接当作 GitHub Release 说明。这里提前在 PR 阶段拦住"忘了写日志"的情况，
      # 免得到发布时才失败；条目内容仍需人工改写，脚本只负责生成草稿与版本对齐。
      - name: Check CHANGELOG covers VERSION
        run: node scripts/changelog.mjs --check

  production-agent-smoke:
    name: Production Agent Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      # These checks exercise deployment commands with mocks. The following step
      # is the real cross-process acceptance against deploy + build Compose.
      - name: Check deployment commands and smoke isolation
        run: python3 -B -m unittest scripts/test_production_deployment.py scripts/test_agent_parity_container_commands.py scripts/test_production_agent_smoke.py scripts/test_install_agent_worker_id.py
      - name: Run real production Agent smoke
        timeout-minutes: 30
        run: python3 scripts/verify-production-agent-smoke.py --output "$RUNNER_TEMP/production-agent-smoke/report.json"
      - name: Upload bounded smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-agent-smoke
          path: ${{ runner.temp }}/production-agent-smoke/
          if-no-files-found: ignore
          retention-days: 7
