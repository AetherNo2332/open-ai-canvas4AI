name: Quality checks
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main, canary, dev]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verification-plan:
    name: Verification plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      fullBackend: ${{ steps.plan.outputs.fullBackend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Test shared planner and executor
        run: node --test scripts/verification-plan.test.mjs scripts/verification-execution.test.mjs web/scripts/run-tests.test.mjs
      - name: Build explicit plan
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/verification-ci.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: verification-plan
          path: verification-plan.json
          if-no-files-found: error
  checks:
    name: ${{ matrix.label }}
    needs: verification-plan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verification-plan.outputs.matrix) }}
    services:
      redis:
        image: ${{ matrix.active && matrix.backend && 'redis:7.4-alpine' || '' }}
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12
      postgres:
        image: ${{ matrix.active && matrix.backend && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_PASSWORD: canvas_test
          POSTGRES_DB: canvas_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CANVAS_TEST_REDIS_ADDR: 127.0.0.1:6379
      CANVAS_TEST_POSTGRES_DSN: postgres://postgres:canvas_test@127.0.0.1:5432/canvas_test?sslmode=disable
      TEST_AGENT_POSTGRES_DSN: postgres://postgres:canvas_test@127.0.0.1:5432/canvas_event_integration?sslmode=disable
      PAYMENT_PLUGIN_SMOKE_TEST: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - uses: actions/download-artifact@v4
        with:
          name: verification-plan
      - uses: actions/setup-go@v5
        if: matrix.active && matrix.backend
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Prepare isolated PostgreSQL and Redis tests
        if: matrix.active && matrix.backend
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -d postgres -c 'CREATE DATABASE canvas_event_integration'
          sudo apt-get update -qq
          sudo apt-get install -y -qq redis-server
          sudo systemctl stop redis-server || true
      - name: Install pinned backend lint tool
        if: matrix.active && matrix.partition == 'backend-rest'
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0
      - uses: oven-sh/setup-bun@v2
        if: matrix.active && (matrix.partition == 'web' || matrix.partition == 'docs')
        with:
          bun-version: 1.3.9
      - name: Install Web dependencies
        if: matrix.active && matrix.partition == 'web'
        working-directory: web
        run: |
          for file in pnpm-lock.yaml package-lock.json yarn.lock; do
            test ! -f "$file" || { echo "Forbidden Web lockfile: $file"; exit 1; }
          done
          bun install --frozen-lockfile
      - name: Install docs dependencies
        if: matrix.active && matrix.partition == 'docs'
        working-directory: docs
        run: bun install --frozen-lockfile
      - name: Install Agent dependencies
        if: matrix.active && matrix.partition == 'agent'
        working-directory: agent
        run: npm ci --ignore-scripts
      - uses: docker/setup-qemu-action@v3
        if: matrix.active && matrix.partition == 'payment'
      - uses: docker/setup-buildx-action@v3
        if: matrix.active && matrix.partition == 'payment'
      - name: Execute only declared checks (unselected partitions report their reason)
        run: node scripts/verification-execution.mjs --plan verification-plan.json --partition "${{ matrix.partition }}" --jobs 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results-${{ matrix.partition }}
          path: |
            .local/cache/verify/result-*.json
            .local/cache/verify/*.log
            .local/cache/verify/*.jsonl
            .local/cache/verify/agent-smoke/
          if-no-files-found: error
  backend:
    name: Backend checks
    needs: [verification-plan, checks]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - uses: actions/download-artifact@v4
        with:
          name: verification-plan
      - uses: actions/download-artifact@v4
        with:
          pattern: verification-results-*
          path: verification-results
      - name: Require exact successful plan result set
        run: node scripts/verification-execution.mjs --plan verification-plan.json --summarize --results verification-results
      - name: Require dependency-backed tests to run and pass
        if: needs.verification-plan.outputs.fullBackend == 'true'
        run: |
          find verification-results -name '*.jsonl' -exec cat {} + > "$RUNNER_TEMP/go-tests.jsonl"
          python3 .github/scripts/test_check_dependency_tests.py
          python3 .github/scripts/check-dependency-tests.py "$RUNNER_TEMP/go-tests.jsonl"
      - name: Explain dependency scope
        if: needs.verification-plan.outputs.fullBackend != 'true'
        run: echo "Full backend dependency suites were not selected by this plan; this is not a test pass."
