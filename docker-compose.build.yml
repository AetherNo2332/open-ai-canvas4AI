services:
  migrate:
    image: open-ai-canvas-backend:server
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}

  backend:
    image: open-ai-canvas-backend:server
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}

  agent:
    image: open-ai-canvas-agent:server
    build:
      context: .
      dockerfile: agent/Dockerfile
      args:
        CANVAS_AGENT_BUILD_COMMIT: ${CANVAS_AGENT_BUILD_COMMIT:-unknown}

  web:
    image: open-ai-canvas-web:server
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_TLDRAW_LICENSE_KEY: ${VITE_TLDRAW_LICENSE_KEY:-}
