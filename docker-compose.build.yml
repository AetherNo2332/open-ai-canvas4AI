services:
  docs:
    image: ${CANVAS_DOCS_IMAGE:-open-ai-canvas-docs:server}
    build:
      context: ./docs
      dockerfile: Dockerfile
      args:
        DOCS_BUILD_ID: ${DOCS_BUILD_ID:-development}
        DOCS_BUILD_COMMIT: ${DOCS_BUILD_COMMIT:-unknown}
        DOCS_BUILD_TIME: ${DOCS_BUILD_TIME:-unknown}
  migrate:
    image: open-ai-canvas-backend:server
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}

  backend:
    image: open-ai-canvas-backend:server
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}

  agent:
    image: open-ai-canvas-agent:server
    build:
      context: .
      dockerfile: agent/Dockerfile
      args:
        CANVAS_AGENT_BUILD_COMMIT: ${CANVAS_AGENT_BUILD_COMMIT:-unknown}

  web:
    image: open-ai-canvas-web:server
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_TLDRAW_LICENSE_KEY: ${VITE_TLDRAW_LICENSE_KEY:-}
